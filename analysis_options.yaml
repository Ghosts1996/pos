include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Сгенерированный и платформенный код анализировать незачем: android/ и
    # ios/ создаются заново в CI (`flutter create .`), build/ — артефакты.
    - build/**
    - android/**
    - ios/**
    # SaaS-платформа (saas/) — отдельный Node/JS проект (Cloud Functions,
    # тесты правил), не часть Flutter-приложения; node_modules там может
    # содержать шаблонные .dart-файлы сторонних пакетов (например,
    # firebase-tools), которые не относятся к этому проекту вовсе.
    - saas/**


linter:
  rules:
    prefer_const_constructors: true
    avoid_print: true
