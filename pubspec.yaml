name: hookah_pos
description: Приложение для управления столами кальянной (без кассы)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.8.0
  intl: ^0.20.3
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ">=0.13.1 <1.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Конфигурация иконки приложения (пакет flutter_launcher_icons).
# Сама иконка генерируется в CI (см. .github/workflows/build-apk.yml,
# шаг "Generate app launcher icon"), потому что папка android/ в этом
# репозитории не хранится — она создаётся заново на каждой сборке
# командой `flutter create .`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21