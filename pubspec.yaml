name: hookah_pos
description: Приложение для управления столами кальянной (без кассы)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  url_launcher: ^6.3.1        # звонок гостю по значку телефона в бронях
  firebase_auth: ^5.3.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.8.0
  intl: ^0.20.3
  uuid: ^4.4.2

  # --- Colibri Lounge, уведомления, ИИ ---
  firebase_messaging: ^15.1.3        # push: вызовы гостей, брони, бонусы
  cloud_functions: ^5.1.3            # прокси к tooken.club для гостевых агентов
  qr_flutter: ^4.1.0                 # QR-коды столов для печати
  speech_to_text: ^7.0.0             # голосовой ввод в чатах с ИИ
  flutter_cache_manager: ^3.4.1      # предзагрузка фото меню в клиентском приложении
  flutter_local_notifications: ^18.0.1   # уведомления зала без сервера
  timezone: ^0.10.0                      # точное время для отложенных уведомлений
  app_links: ^6.3.2                      # QR стола открывает приложение по ссылке

  # --- Интеграции: ЕГАИС / Честный знак / печать чека / сканеры ---
  http: ^1.2.2                       # HTTP-клиент к локальному УТМ ЕГАИС
  xml: ^6.5.0                        # сборка XML-документов для УТМ
  mobile_scanner: ^5.2.3             # сканирование камерой телефона (EAN/QR/DataMatrix)
  google_mlkit_barcode_scanning: ^0.14.1 # разовый статический анализ фото (без камеры/превью) — фикс NPE в analyzeImage
  google_mlkit_commons: ^0.11.0      # InputImage для analyzeImage: использовался транзитивно, теперь объявлен явно
  permission_handler: ^11.3.1        # запрос разрешения на камеру для сканера
  esc_pos_utils_plus: ^2.0.4         # сборка ESC/POS-команд для чекового принтера
  print_bluetooth_thermal: ^1.1.4    # печать на чековом принтере по Bluetooth
  flutter_foreground_task: ^8.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ">=0.13.1 <1.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Конфигурация иконки приложения (пакет flutter_launcher_icons).
# Сама иконка генерируется в CI (см. .github/workflows/build-apk.yml,
# шаг "Generate app launcher icon"), потому что папка android/ в этом
# репозитории не хранится — она создаётся заново на каждой сборке
# командой `flutter create .`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21