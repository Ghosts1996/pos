name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Одна сборка — два приложения. Они живут в одном репозитории и делят
# модели/сервисы, но различаются точкой входа, applicationId, названием и
# иконкой:
#
#   POS            lib/main.dart                → com.hookahpos      → hookah-pos-apk
#   Colibri Lounge lib/client/kolibri_main.dart → com.kolibrilounge  → kolibri-lounge-apk
#
# Разные applicationId обязательны: с одинаковым id второй APK затирает
# первый при установке на одно устройство и их нельзя развести в Play.
# Под каждый applicationId в Firebase должно быть зарегистрировано
# отдельное Android-приложение, и для каждого — свой google-services.json
# в секретах репозитория.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pos
            entrypoint: lib/main.dart
            project_name: hookahpos          # applicationId = com.hookahpos
            label: Colibri POS
            icon: assets/icon/icon.png
            artifact: hookah-pos-apk
            gservices_secret: GOOGLE_SERVICES_JSON
            deeplink: 'false'
          - app: kolibri
            entrypoint: lib/client/kolibri_main.dart
            project_name: kolibrilounge      # applicationId = com.kolibrilounge
            label: Colibri Lounge
            icon: assets/icon/kolibri.png
            artifact: kolibri-lounge-apk
            gservices_secret: GOOGLE_SERVICES_JSON_KOLIBRI
            deeplink: 'true'

    name: Build ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.app }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate missing Android platform files
        run: |
          # --org/--project-name подобраны так, чтобы applicationId получился
          # РОВНО таким, под каким приложение зарегистрировано в Firebase
          # (com.hookahpos / com.kolibrilounge). Если написать
          # "--org com.hookahpos --project-name hookah_pos", выйдет
          # "com.hookahpos.hookah_pos" — нативный Firebase SDK перестанет
          # видеть приложение и Storage начнёт падать с object-not-found.
          flutter create . --platforms=android --org com --project-name ${{ matrix.project_name }}
          test -d android && echo "android/ готова" || (echo "не удалось создать android/" && exit 1)

          # flutter create кладёт в test/ свой шаблонный widget_test.dart со
          # счётчиком: он импортирует package:${{ matrix.project_name }}/main.dart
          # и виджет MyApp, которых в этом проекте нет (пакет называется
          # hookah_pos, а точек входа две — lib/main.dart и
          # lib/client/kolibri_main.dart). Файл в репозитории не хранится,
          # появляется только здесь и валит шаг тестов. Удаляем сразу.
          rm -f test/widget_test.dart

      - name: Bump compileSdk for CameraX / mobile_scanner compatibility
        run: |
          # mobile_scanner 5.x+ требует compileSdk >= 34 (CameraX 1.3.x), а
          # транзитивные androidx-зависимости — >= 36, иначе сборка падает
          # на checkReleaseAarMetadata.
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          sed -i -E 's/compileSdk[[:space:]]*=.*/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$APP_GRADLE"
          grep -E "compileSdk" "$APP_GRADLE"

      - name: Add google-services.json (Firebase Android config)
        env:
          GSERVICES: ${{ secrets[matrix.gservices_secret] }}
        run: |
          # Для каждого applicationId — свой файл. Секреты:
          #   GOOGLE_SERVICES_JSON          — приложение com.hookahpos
          #   GOOGLE_SERVICES_JSON_KOLIBRI  — приложение com.kolibrilounge
          # Оба берутся в консоли Firebase: Project settings → Your apps.
          if [ -z "$GSERVICES" ]; then
            echo "::error::Секрет ${{ matrix.gservices_secret }} не задан (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$GSERVICES" > android/app/google-services.json
          # Проверяем, что в файле есть нужный package_name — иначе Gradle
          # упадёт на этапе processReleaseGoogleServices с невнятной ошибкой.
          grep -q "com.${{ matrix.project_name }}" android/app/google-services.json \
            || (echo "::error::В ${{ matrix.gservices_secret }} нет приложения com.${{ matrix.project_name }}" && exit 1)

      - name: Apply Google Services Gradle plugin
        run: |
          SETTINGS=android/settings.gradle.kts
          [ -f "$SETTINGS" ] || SETTINGS=android/settings.gradle
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          PROJECT_GRADLE=android/build.gradle.kts
          [ -f "$PROJECT_GRADLE" ] || PROJECT_GRADLE=android/build.gradle

          if grep -q "pluginManagement" "$SETTINGS" 2>/dev/null; then
            if ! grep -q "com.google.gms.google-services" "$SETTINGS"; then
              sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$SETTINGS"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services")' "$APP_GRADLE"
            fi
          else
            if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
              sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
          fi

      - name: Ensure required permissions and manifest entries
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          add_permission() {
            if ! grep -q "$1" "$MANIFEST"; then
              sed -i "/<manifest /a\\    <uses-permission android:name=\"$1\" />" "$MANIFEST"
            fi
          }
          add_permission "android.permission.INTERNET"
          add_permission "android.permission.CAMERA"
          add_permission "android.permission.READ_MEDIA_IMAGES"
          add_permission "android.permission.READ_EXTERNAL_STORAGE"
          # Голосовой ввод в чатах с ИИ (speech_to_text).
          add_permission "android.permission.RECORD_AUDIO"
          # Push-уведомления на Android 13+ требуют явного разрешения.
          add_permission "android.permission.POST_NOTIFICATIONS"
          # Точные будильники: без них напоминание об углях сдвигается
          # системой на десятки минут ради экономии батареи.
          add_permission "android.permission.SCHEDULE_EXACT_ALARM"
          add_permission "android.permission.USE_EXACT_ALARM"
          add_permission "android.permission.RECEIVE_BOOT_COMPLETED"
          add_permission "android.permission.VIBRATE"
          # Постоянное уведомление «касса следит за залом». Без работающей
          # службы Android выгружает свёрнутое приложение, подписки на базу
          # обрываются, и вызовы гостей перестают доходить.
          add_permission "android.permission.FOREGROUND_SERVICE"
          add_permission "android.permission.FOREGROUND_SERVICE_DATA_SYNC"
          add_permission "android.permission.WAKE_LOCK"

          if ! grep -q "android.hardware.camera" "$MANIFEST"; then
            sed -i "/<manifest /a\\    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />" "$MANIFEST"
          fi

          # <queries>: системная камера (image_picker), движок распознавания
          # речи и звонок по tel: (кнопка телефона в бронях) — без этого
          # блока Android 11+ считает их «невидимыми» для приложения, и
          # canLaunchUrl('tel:...') всегда возвращает false.
          if ! grep -q "<queries>" "$MANIFEST"; then
            sed -i "/<\/manifest>/i\\    <queries>\n        <intent>\n            <action android:name=\"android.media.action.IMAGE_CAPTURE\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.speech.RecognitionService\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.DIAL\" />\n            <data android:scheme=\"tel\" />\n        </intent>\n    </queries>" "$MANIFEST"
          fi

          if ! grep -q "com.google.mlkit.vision.DEPENDENCIES" "$MANIFEST"; then
            sed -i "/<application/,/>/{/>/a\\    <meta-data android:name=\"com.google.mlkit.vision.DEPENDENCIES\" android:value=\"barcode\" />
            }" "$MANIFEST"
          fi

          # Приёмники flutter_local_notifications: показывают запланированные
          # уведомления и восстанавливают их после перезагрузки планшета.
          # Правим XML питоном, а не sed: многострочная вставка с кавычками
          # внутри YAML ломает файл workflow.
          python3 - "$MANIFEST" <<'PYEOF'
          import sys
          path = sys.argv[1]
          xml = open(path, encoding='utf-8').read()
          if 'flutter_foreground_task' not in xml:
              service = (
                  '        <service\n'
                  '            android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n'
                  '            android:foregroundServiceType="dataSync"\n'
                  '            android:exported="false" />\n'
              )
              xml = xml.replace('</application>', service + '    </application>', 1)
              open(path, 'w', encoding='utf-8').write(xml)
          if 'ScheduledNotificationReceiver' not in xml:
              receivers = (
                  '        <receiver android:exported="false" '
                  'android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" '
                  'android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
              )
              xml = xml.replace('</application>', receivers + '    </application>', 1)
              open(path, 'w', encoding='utf-8').write(xml)
          PYEOF

          # Название приложения на экране устройства — своё у каждой сборки.
          sed -i 's/android:label="[^"]*"/android:label="${{ matrix.label }}"/' "$MANIFEST"

          # Диплинки клиентского приложения — два, и оба нужны.
          #
          #   kolibri://table/{id}  — схема из уже напечатанных наклеек.
          #     Их нельзя менять, коды разложены по столам.
          #
          #   https://colibri-lounge.web.app/table/{id} — App Link. Он с
          #     android:autoVerify="true": при установке Android скачивает
          #     https://colibri-lounge.web.app/.well-known/assetlinks.json,
          #     сверяет отпечаток подписи APK и, если сходится, открывает
          #     ссылку сразу в приложении, минуя браузер. Именно это даёт
          #     «навёл камеру — открылся стол», без мелькания сайта.
          #
          # Проверка привязана к подписи, поэтому APK обязан быть подписан
          # постоянным ключом из секретов (см. шаг Configure release
          # signing). С одноразовым debug-ключом отпечаток не сойдётся и
          # ссылка просто откроется в браузере — страница сама предложит
          # установку, ничего не сломается.
          if [ "${{ matrix.deeplink }}" = "true" ]; then
            python3 - "$MANIFEST" <<'PY'
          import sys
          path = sys.argv[1]
          xml = open(path, encoding='utf-8').read()
          added = ''
          if 'android:scheme="kolibri"' not in xml:
              added += (
                  '\n            <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  '                <data android:scheme="kolibri" android:host="table" />\n'
                  '            </intent-filter>'
              )
          if 'colibri-lounge.web.app' not in xml:
              added += (
                  '\n            <intent-filter android:autoVerify="true">\n'
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  '                <data android:scheme="https"\n'
                  '                      android:host="colibri-lounge.web.app"\n'
                  '                      android:pathPrefix="/table" />\n'
                  '            </intent-filter>'
              )
          if added:
              # Вставляем внутрь основной <activity>, перед её закрытием.
              xml = xml.replace('</activity>', added + '\n        </activity>', 1)
              open(path, 'w', encoding='utf-8').write(xml)
          PY
          fi
          cat "$MANIFEST"

      - name: Enable core library desugaring
        run: |
          # flutter_local_notifications требует desugaring: плагин использует
          # java.time, которого нет на старых Android без этой прослойки.
          # Правим питоном — Gradle-файл с фигурными скобками через sed
          # правится ненадёжно.
          APP_GRADLE=android/app/build.gradle.kts
          IS_KTS=1
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE=android/app/build.gradle
            IS_KTS=0
          fi
          python3 - "$APP_GRADLE" "$IS_KTS" <<'PYEOF'
          import re, sys
          path, is_kts = sys.argv[1], sys.argv[2] == '1'
          src = open(path, encoding='utf-8').read()

          if 'isCoreLibraryDesugaringEnabled' not in src and 'coreLibraryDesugaringEnabled' not in src:
              flag = ('        isCoreLibraryDesugaringEnabled = true\n' if is_kts
                      else '        coreLibraryDesugaringEnabled true\n')
              # Флаг ставится внутрь блока compileOptions.
              if 'compileOptions' in src:
                  src = re.sub(r'(compileOptions\s*\{)', r'\1\n' + flag.rstrip('\n'), src, count=1)
              else:
                  block = ('    compileOptions {\n' + flag +
                           ('        sourceCompatibility = JavaVersion.VERSION_11\n'
                            '        targetCompatibility = JavaVersion.VERSION_11\n' if is_kts else
                            '        sourceCompatibility JavaVersion.VERSION_11\n'
                            '        targetCompatibility JavaVersion.VERSION_11\n') +
                           '    }\n')
                  src = src.replace('    buildTypes {', block + '    buildTypes {', 1)

          if 'desugar_jdk_libs' not in src:
              dep = ('    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                     if is_kts else
                     "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
              if re.search(r'^dependencies\s*\{', src, re.M):
                  src = re.sub(r'^(dependencies\s*\{)', r'\1\n' + dep, src, count=1, flags=re.M)
              else:
                  src += '\ndependencies {\n' + dep + '\n}\n'

          open(path, 'w', encoding='utf-8').write(src)
          print('desugaring включён')
          PYEOF
          grep -n "Desugar\|desugar" "$APP_GRADLE"

      - name: Force bundled (offline) ML Kit barcode model
        run: |
          # Play Services-вариант ML Kit докачивает модель по сети при первом
          # использовании и падает NullPointerException, если докачка не
          # прошла. При сайдлоуде APK (не из Play Store) это происходит
          # регулярно, поэтому подключаем bundled-модель — она внутри APK и
          # работает офлайн сразу после установки.
          APP_GRADLE=android/app/build.gradle.kts
          IS_KTS=1
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE=android/app/build.gradle
            IS_KTS=0
          fi
          if ! grep -q "com.google.mlkit:barcode-scanning" "$APP_GRADLE"; then
            if [ "$IS_KTS" = "1" ]; then
              DEP_LINE='    implementation("com.google.mlkit:barcode-scanning:17.3.0")'
            else
              DEP_LINE="    implementation 'com.google.mlkit:barcode-scanning:17.3.0'"
            fi
            if grep -q "^dependencies {" "$APP_GRADLE"; then
              sed -i "/^dependencies {/a\\${DEP_LINE}" "$APP_GRADLE"
            else
              printf '\ndependencies {\n%s\n}\n' "$DEP_LINE" >> "$APP_GRADLE"
            fi
          fi

      - name: Add ProGuard/R8 keep rules for ML Kit and mobile_scanner
        run: |
          # R8 в релизе переименовывает внутренности ML Kit и CameraX,
          # которые работают через рефлексию, — сканер падает с NPE только в
          # release-сборке. Keep-правила это лечат.
          RULES=android/app/proguard-rules.pro
          mkdir -p "$(dirname "$RULES")"
          touch "$RULES"
          if ! grep -q "google.mlkit" "$RULES" 2>/dev/null; then
            cat >> "$RULES" <<'EOF'
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode_bundled.** { *; }
          -keep class com.google.mlkit.vision.barcode.** { *; }
          -keep class com.google.mlkit.vision.common.** { *; }
          -keep class com.google.mlkit.common.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          -keep class androidx.camera.** { *; }
          -dontwarn androidx.camera.**
          EOF
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Без своего keystore Flutter подписывает release-сборку debug-ключом,
          # который в CI генерируется заново на каждом запуске. SHA-1 при этом
          # меняется, и Firebase Phone Auth (вход по SMS в «Colibri Lounge»)
          # перестаёт работать. Поэтому подписываем постоянным ключом из
          # секретов; если секретов нет — предупреждаем и собираем как раньше.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK подписан debug-ключом, вход по SMS работать не будет."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          APP_GRADLE=android/app/build.gradle.kts
          if [ -f "$APP_GRADLE" ]; then
            python3 - "$APP_GRADLE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          if 'keystoreProperties' not in src:
              header = (
                  'import java.util.Properties\n'
                  'import java.io.FileInputStream\n\n'
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              src = header + src
              signing = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String?\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String?\n'
                  '            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n'
                  '            storePassword = keystoreProperties["storePassword"] as String?\n'
                  '        }\n'
                  '    }\n'
              )
              src = src.replace('    buildTypes {', signing + '    buildTypes {', 1)
              src = src.replace('signingConfig = signingConfigs.getByName("debug")',
                                'signingConfig = signingConfigs.getByName("release")')
              open(path, 'w', encoding='utf-8').write(src)
          PYEOF
          else
            echo "::warning::build.gradle.kts не найден — проверьте подпись вручную"
          fi

      - name: Проверка отпечатка подписи для App Links
        if: matrix.deeplink == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Android открывает https-ссылку сразу в приложении только если
          # отпечаток подписи APK совпадает с тем, что лежит на сайте в
          # .well-known/assetlinks.json. Не совпал — ссылка молча уходит в
          # браузер, и ни в приложении, ни в логах ошибки не будет.
          # Поэтому сверяем здесь: отпечаток известен только сборке.
          AL=public/.well-known/assetlinks.json
          KS=android/app/upload-keystore.jks
          if [ ! -f "$KS" ]; then
            echo "::warning::Постоянного ключа нет — App Links не заработают."
            exit 0
          fi
          FP=$(keytool -list -v -keystore "$KS" -alias "$KEY_ALIAS" \
                 -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
               | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ' \r')
          if [ -z "$FP" ]; then
            echo "::warning::Не удалось прочитать отпечаток из ключа."
            exit 0
          fi
          echo "Отпечаток подписи этой сборки:"
          echo "  $FP"
          if grep -q "$FP" "$AL"; then
            echo "Совпадает с assetlinks.json — QR будет открывать приложение напрямую."
          else
            # Не роняем сборку: APK остаётся рабочим, просто ссылка со
            # стола откроется через браузер, а не сразу в приложении.
            echo "::warning::Отпечаток не совпадает с $AL — QR будет открываться через браузер."
            echo "::warning::Нужно вписать в assetlinks.json отпечаток, напечатанный выше."
            echo "Сейчас в файле:"
            cat "$AL"
          fi

      - name: Create notification icon
        run: |
          # Android рисует иконку уведомления силуэтом: любой цвет и любые
          # детали теряются, остаётся плоский белый контур на прозрачном
          # фоне. Поэтому здесь простой восклицательный знак — он читается
          # в строке состояния даже размером в несколько пикселей, в
          # отличие от колокольчика с деталями, который превращался в
          # неразборчивое пятно.
          DRAWABLE=android/app/src/main/res/drawable
          mkdir -p "$DRAWABLE"
          cat > "$DRAWABLE/ic_notification.xml" <<'XMLEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M10.6,3.2h2.8v11.2h-2.8z"/>
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M12,18.6m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0"/>
          </vector>
          XMLEOF
          echo "иконка уведомлений создана"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: |
          # У приложений разные иконки. Если файла для клиентской сборки нет
          # (assets/icon/kolibri.png), берём общую — сборка не должна падать
          # из-за отсутствующей картинки.
          ICON="${{ matrix.icon }}"
          if [ ! -f "$ICON" ]; then
            echo "::warning::$ICON не найден — использую assets/icon/icon.png"
            ICON="assets/icon/icon.png"
          fi
          sed -i -E "s|image_path: \".*\"|image_path: \"$ICON\"|" pubspec.yaml
          dart run flutter_launcher_icons

      - name: Analyze (informational — does not block the build)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # Юнит-тесты чистой логики (деньги, остатки, таймеры, коды
      # маркировки). Быстрые, без Firebase — единственный шаг, который
      # реально ловит регрессии до того, как APK уедет в зал, поэтому
      # он блокирующий: падение теста останавливает сборку.
      - name: Unit tests
        run: flutter test

      - name: Build APK (release)
        # BUILD_NUMBER виден в приложении (профиль гостя). Приложения
        # ставятся файлом, и без такой метки нельзя понять, какая версия
        # стоит на конкретном телефоне: однажды это уже стоило разбора
        # «бага», которого в коде не было.
        run: |
          flutter build apk --release \
            -t ${{ matrix.entrypoint }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ matrix.artifact }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/app/outputs/flutter-apk/${{ matrix.artifact }}.apk
