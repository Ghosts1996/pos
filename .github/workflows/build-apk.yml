name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # В репозитории нет папки android/ (android-проект в него никогда не
      # клали — обычно её создаёт сам Flutter SDK командой `flutter create`).
      # `flutter create .` в директории, где уже есть pubspec.yaml и lib/,
      # НЕ трогает существующие файлы — он только добирает недостающие
      # платформенные файлы (android/, gradle-обёртку и т.д.), используя
      # именно ту версию Flutter/Gradle/AGP, которая только что установлена
      # на этом раннере, — так исключается рассинхрон версий.
      - name: Generate missing Android platform files
        run: |
          flutter create . --platforms=android --org com.hookahpos --project-name hookah_pos
          test -d android && echo "android/ готова" || (echo "не удалось создать android/" && exit 1)

      # Flutter по умолчанию добавляет разрешение INTERNET только в
      # debug-манифест (нужно для hot reload), а не в основной. Наше
      # приложение целиком работает через Firebase/интернет, поэтому без
      # этой строки в основном манифесте release-APK будет собираться
      # без ошибок, но не сможет достучаться до сети — экраны будут вечно
      # висеть на загрузке. Добавляем разрешение и заодно человеческое
      # название приложения на экране телефона.
      - name: Ensure INTERNET permission for release builds
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          sed -i 's/android:label="[^"]*"/android:label="Hookah POS"/' "$MANIFEST"
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      # Анализ помогает ловить реальные ошибки в коде, но не должен мешать
      # получить готовый APK из-за безобидного предупреждения линтера —
      # поэтому не блокируем сборку, а просто печатаем результат в лог.
      - name: Analyze (informational — does not block the build)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hookah-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
