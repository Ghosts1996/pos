name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate missing Android platform files
        run: |
          flutter create . --platforms=android --org com.hookahpos --project-name hookah_pos
          test -d android && echo "android/ готова" || (echo "не удалось создать android/" && exit 1)

      - name: Ensure required permissions for release builds
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          add_permission() {
            if ! grep -q "$1" "$MANIFEST"; then
              sed -i "/<manifest /a\\    <uses-permission android:name=\"$1\" />" "$MANIFEST"
            fi
          }
          # Сеть — Firestore/Storage.
          add_permission "android.permission.INTERNET"
          # Камера и медиатека — фото категорий/блюд в редакторе меню
          # (image_picker). READ_MEDIA_IMAGES нужен на Android 13+, где
          # старое READ_EXTERNAL_STORAGE уже не действует на изображения.
          add_permission "android.permission.CAMERA"
          add_permission "android.permission.READ_MEDIA_IMAGES"
          add_permission "android.permission.READ_EXTERNAL_STORAGE"
          sed -i 's/android:label="[^"]*"/android:label="Hookah POS"/' "$MANIFEST"
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (informational — does not block the build)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hookah-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk