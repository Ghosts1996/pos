name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate missing Android platform files
        run: |
          # ВАЖНО: --org/--project-name подобраны так, чтобы итоговый
          # applicationId был РОВНО "com.hookahpos" — это package_name,
          # под которым Android-приложение зарегистрировано в Firebase
          # (см. google-services.json). Раньше здесь стояло
          # --org com.hookahpos --project-name hookah_pos, из-за чего
          # реально получался "com.hookahpos.hookah_pos" — приложение не
          # совпадало с регистрацией в Firebase, и нативный Firebase SDK на
          # Android (в частности Storage) работал некорректно, из-за чего
          # загрузка фото падала с [firebase_storage/object-not-found]
          # независимо от Dart-кода.
          flutter create . --platforms=android --org com --project-name hookahpos
          test -d android && echo "android/ готова" || (echo "не удалось создать android/" && exit 1)

      - name: Bump compileSdk for CameraX / mobile_scanner compatibility
        run: |
          # mobile_scanner 5.x+ требует compileSdk >= 34 из-за CameraX 1.3.x.
          # Кроме того ряд других плагинов (app_links, image_picker_android,
          # flutter_plugin_android_lifecycle, shared_preferences_android,
          # sqflite_android, url_launcher_android) и транзитивные androidx-
          # зависимости (androidx.core 1.18.0, androidx.activity 1.13.0 и т.д.)
          # требуют compileSdk >= 36 — сборка падает на checkReleaseAarMetadata,
          # если поставить только 35. Поднимаем сразу до 36.
          #
          # ВАЖНО: свежий шаблон Flutter пишет "compileSdk = flutter.compileSdkVersion"
          # (без цифр вообще). Старый sed с шаблоном "[0-9]*" совпадал с пустой
          # строкой прямо перед "flutter.compileSdkVersion" и ВСТАВЛЯЛ число перед
          # ним, а не заменял — получалось "compileSdk = 35flutter.compileSdkVersion"
          # и сборка падала с "Expecting an element". Теперь заменяем весь хвост
          # строки после "compileSdk =" целиком.
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          sed -i -E 's/compileSdk[[:space:]]*=.*/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$APP_GRADLE"
          echo "----- build.gradle compileSdk -----"; grep -E "compileSdk" "$APP_GRADLE"

      - name: Add google-services.json (Firebase Android config)
        run: |
          # Файл нужен, чтобы нативный Firebase SDK на Android (Storage в
          # первую очередь) корректно привязался к проекту hoocah-pos —
          # без него Storage вела себя нестабильно даже при правильном
          # applicationId. Секрет GOOGLE_SERVICES_JSON должен содержать
          # СЫРОЕ содержимое google-services.json (Settings → Secrets and
          # variables → Actions → New repository secret).
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::Секрет GOOGLE_SERVICES_JSON не задан в настройках репозитория (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          cat > android/app/google-services.json <<'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Apply Google Services Gradle plugin
        run: |
          # У Flutter есть два варианта шаблона android/ (Groovy и Kotlin
          # DSL) в зависимости от версии — определяем, какой сгенерировался,
          # и подключаем плагин google-services соответствующим способом.
          SETTINGS=android/settings.gradle.kts
          [ -f "$SETTINGS" ] || SETTINGS=android/settings.gradle
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          PROJECT_GRADLE=android/build.gradle.kts
          [ -f "$PROJECT_GRADLE" ] || PROJECT_GRADLE=android/build.gradle

          if grep -q "pluginManagement" "$SETTINGS" 2>/dev/null; then
            echo "Обнаружен новый шаблон (plugins DSL в settings.gradle.kts)"
            if ! grep -q "com.google.gms.google-services" "$SETTINGS"; then
              sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$SETTINGS"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services")' "$APP_GRADLE"
            fi
          else
            echo "Обнаружен старый шаблон (buildscript classpath)"
            if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
              sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
          fi

          echo "----- $SETTINGS -----"; cat "$SETTINGS"
          echo "----- $APP_GRADLE -----"; cat "$APP_GRADLE"

      - name: Ensure required permissions for release builds
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          add_permission() {
            if ! grep -q "$1" "$MANIFEST"; then
              sed -i "/<manifest /a\\    <uses-permission android:name=\"$1\" />" "$MANIFEST"
            fi
          }
          # Сеть — Firestore/Storage.
          add_permission "android.permission.INTERNET"
          # Камера и медиатека — фото категорий/блюд в редакторе меню
          # (image_picker). READ_MEDIA_IMAGES нужен на Android 13+, где
          # старое READ_EXTERNAL_STORAGE уже не действует на изображения.
          add_permission "android.permission.CAMERA"
          add_permission "android.permission.READ_MEDIA_IMAGES"
          add_permission "android.permission.READ_EXTERNAL_STORAGE"
          # mobile_scanner требует явного объявления фичи камеры
          if ! grep -q "android.hardware.camera" "$MANIFEST"; then
            sed -i "/<manifest /a\\    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />" "$MANIFEST"
          fi
          # Android 11+ (API 30+): без <queries> приложение не видит системную
          # камеру (image_picker), что ломает _scanBarcodeFromCameraPhoto.
          if ! grep -q "<queries>" "$MANIFEST"; then
            sed -i "/<\/manifest>/i\    <queries>\n        <intent>\n            <action android:name=\"android.media.action.IMAGE_CAPTURE\" />\n        </intent>\n    </queries>" "$MANIFEST"
          fi
          # google_mlkit_barcode_scanning по умолчанию докачивает модель
          # распознавания штрихкодов через Play Services ЛЕНИВО, при первом
          # обращении. Если докачка не успевает завершиться (нет интернета
          # при первом запуске, медленная сеть и т.п.), любой вызов падает с
          # NullPointerException внутри
          # com.google.android.gms.internal.mlkit_vision_common.zzmj —
          # именно эта ошибка была на скриншоте пользователя. Эта meta-data
          # заставляет Play Store скачать модель СРАЗУ при установке
          # приложения, а не при первом использовании камеры.
          if ! grep -q "com.google.mlkit.vision.DEPENDENCIES" "$MANIFEST"; then
            sed -i "/<application/,/>/{/>/a\\    <meta-data android:name=\"com.google.mlkit.vision.DEPENDENCIES\" android:value=\"barcode\" />
            }" "$MANIFEST"
          fi
          sed -i 's/android:label="[^"]*"/android:label="Hookah POS"/' "$MANIFEST"
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Force bundled (offline) ML Kit barcode model
        run: |
          # google_mlkit_barcode_scanning по умолчанию тянет через
          # транзитивные зависимости Play Services-вариант распознавания
          # штрихкодов (com.google.android.gms:play-services-mlkit-barcode-scanning),
          # который докачивает модель ПО СЕТИ при первом использовании —
          # именно это падает с NullPointerException внутри
          # com.google.android.gms.internal.mlkit_vision_common.zzmj, если
          # докачка не успела/не смогла произойти (см. скриншот/видео
          # пользователя). Явная докачка модели Play Store'ом при установке
          # (meta-data com.google.mlkit.vision.DEPENDENCIES) работает ТОЛЬКО
          # при установке из Play Store — а этот APK ставится напрямую
          # (сайдлоуд), поэтому тот механизм здесь не срабатывает.
          #
          # Решение: явно подключаем "bundled"-вариант модели
          # (com.google.mlkit:barcode-scanning) — она зашивается прямо в
          # APK (+неск. МБ к размеру) и работает полностью офлайн, без
          # Play Services и без сети, сразу после установки.
          APP_GRADLE=android/app/build.gradle.kts
          IS_KTS=1
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE=android/app/build.gradle
            IS_KTS=0
          fi
          if ! grep -q "com.google.mlkit:barcode-scanning" "$APP_GRADLE"; then
            if [ "$IS_KTS" = "1" ]; then
              DEP_LINE='    implementation("com.google.mlkit:barcode-scanning:17.3.0")'
            else
              DEP_LINE="    implementation 'com.google.mlkit:barcode-scanning:17.3.0'"
            fi
            if grep -q "^dependencies {" "$APP_GRADLE"; then
              sed -i "/^dependencies {/a\\${DEP_LINE}" "$APP_GRADLE"
            else
              printf '\ndependencies {\n%s\n}\n' "$DEP_LINE" >> "$APP_GRADLE"
            fi
          fi
          echo "----- $APP_GRADLE (dependencies) -----"
          grep -A3 -E "^dependencies \{" "$APP_GRADLE" || true

      - name: Add ProGuard/R8 keep rules for ML Kit and mobile_scanner
        run: |
          # ПРИЧИНА реальных сбоев камеры/сканера на РАЗНЫХ устройствах
          # (одинаковая ошибка вида "Attempt to invoke virtual method
          # 'fh2 bh2.a(gb)' ... null object reference" с обфусцированными
          # именами классов/методов из 1-2 букв) — это R8/ProGuard,
          # который в релизной сборке (flutter build apk --release)
          # переименовывает и вырезает классы, включая внутренности
          # ML Kit и mobile_scanner/CameraX, если не сказать ему явно их
          # не трогать. ML Kit активно использует рефлексию и динамическую
          # загрузку классов — без keep-правил R8 ломает именно этот путь,
          # что выглядит как случайный сбой камеры, а на деле стабильно
          # воспроизводится на любом устройстве с этой сборкой.
          RULES=android/app/proguard-rules.pro
          mkdir -p "$(dirname "$RULES")"
          touch "$RULES"
          if ! grep -q "google.mlkit" "$RULES" 2>/dev/null; then
            cat >> "$RULES" <<'EOF'

# --- ML Kit (распознавание штрихкодов/DataMatrix) и mobile_scanner/CameraX ---
# Без этих правил R8 в релизной сборке ломает рефлексию/инициализацию
# ML Kit — сканер падает с NullPointerException на реальных устройствах
# (в debug-сборке без минификации всё работает нормально, поэтому баг
# незаметен при обычной разработке).
-keep class com.google.mlkit.** { *; }
-keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }
-keep class com.google.android.gms.internal.mlkit_vision_barcode.** { *; }
-keep class com.google.android.gms.internal.mlkit_vision_barcode_bundled.** { *; }
-keep class com.google.mlkit.vision.barcode.** { *; }
-keep class com.google.mlkit.vision.common.** { *; }
-keep class com.google.mlkit.common.** { *; }
-dontwarn com.google.mlkit.**

# mobile_scanner (CameraX-based live preview scanner)
-keep class dev.steenbakker.mobile_scanner.** { *; }
-keep class androidx.camera.** { *; }
-dontwarn androidx.camera.**
EOF
          fi
          # Убеждаемся, что release-сборка вообще подключает этот файл
          # правил (стандартный шаблон Flutter это делает по умолчанию,
          # но проверяем на случай нестандартного build.gradle).
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          if ! grep -q "proguard-rules.pro" "$APP_GRADLE"; then
            echo "::warning::proguard-rules.pro не подключён в $APP_GRADLE — добавьте proguardFiles вручную в buildTypes.release"
          fi
          echo "----- $RULES -----"; cat "$RULES"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze (informational — does not block the build)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hookah-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk