name: Публичный APK (демо-сборка для сайта)

on:
  workflow_dispatch: {}
  # Демо-сборка на сайте должна совпадать с текущей кассой — собираем при
  # каждом изменении кода приложения в рабочей ветке. workflow_dispatch с
  # не основной ветки GitHub не даёт, пока файла нет в main.
  push:
    branches: [claude/dazzling-babbage-n65p6l]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/public-apk-release.yml'
      - '.github/scripts/patch-firestore-windows.js'

# Несколько пушей подряд — собирается только последний: старая сборка
# отменяется, файл на сайте всегда от самой свежей версии.
concurrency:
  group: public-apk
  cancel-in-progress: true

# Универсальная касса платформы для кнопки «Скачать» на лендинге: SAAS_MODE,
# но без кодов заведения — при первом запуске вводят свой код или жмут
# «Демо». Файл уходит на сервер (https://pii.zalpos.ru/downloads/zalpos.apk,
# ссылку zalpos.apk ставит migrate-domain.sh), копия — в GitHub Release
# public-apk.
#
# Отдельно от build-apk.yml и saas-on-demand-build.yml, чтобы правка одной
# сборки не задевала другие. Исправляя баг вроде ML Kit или R8 в одном
# файле, проверьте и остальные.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Две демо-сборки для сайта: касса (выбор «Демо» или код заведения) и
    # приложение гостя (код демо-сети из кассы или новое демо, см.
    # kSaasGuestDemo в lib/build_info.dart).
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pos
            entrypoint: lib/main.dart
            project_name: hookahpossaas
            application_id: com.hookahpossaas
            gservices_secret: GOOGLE_SERVICES_JSON_SAAS
            appid_secret: SAAS_FIREBASE_APP_ID
            label: 'ZalPOS (демо)'
            icon: assets/icon/icon.png
            icon_foreground: assets/icon/icon_foreground.png
            icon_background: assets/icon/icon_background.png
            guest_demo: 'false'
            apk_name: zalpos-kassa-demo.apk
          - app: kolibri
            entrypoint: lib/client/kolibri_main.dart
            project_name: kolibriloungesaas
            application_id: com.kolibriloungesaas
            gservices_secret: GOOGLE_SERVICES_JSON_SAAS_KOLIBRI
            appid_secret: SAAS_FIREBASE_APP_ID_KOLIBRI
            label: 'ZalPOS Гость (демо)'
            icon: assets/icon/guest_icon.png
            icon_foreground: assets/icon/guest_icon_foreground.png
            icon_background: assets/icon/guest_icon_background.png
            guest_demo: 'true'
            apk_name: zalpos-guest-demo.apk
    name: Build public demo APK (${{ matrix.app }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-public-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate missing Android platform files
        run: |
          # com.hookahpossaas — то же приложение Firebase (SaaS-проект), что
          # и у персональных сборок saas-on-demand-build.yml: это ОДНА и та
          # же общая для всех арендаторов кодовая база, разница только в
          # запечённых SAAS_PRESET_*.
          flutter create . --platforms=android --org com --project-name ${{ matrix.project_name }}
          test -d android && echo "android/ готова" || (echo "не удалось создать android/" && exit 1)
          rm -f test/widget_test.dart

      - name: Bump compileSdk for CameraX / mobile_scanner compatibility
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          sed -i -E 's/compileSdk[[:space:]]*=.*/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$APP_GRADLE"
          grep -E "compileSdk" "$APP_GRADLE"

      - name: Add google-services.json (SaaS Firebase project)
        env:
          GSERVICES: ${{ secrets[matrix.gservices_secret] }}
          APP_ID: ${{ matrix.application_id }}
          SECRET_NAME: ${{ matrix.gservices_secret }}
        run: |
          if [ -z "$GSERVICES" ]; then
            echo "::error::Секрет $SECRET_NAME не задан (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$GSERVICES" > android/app/google-services.json
          grep -q "$APP_ID" android/app/google-services.json \
            || (echo "::error::В $SECRET_NAME нет приложения $APP_ID" && exit 1)

      - name: Apply Google Services Gradle plugin
        run: |
          SETTINGS=android/settings.gradle.kts
          [ -f "$SETTINGS" ] || SETTINGS=android/settings.gradle
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          PROJECT_GRADLE=android/build.gradle.kts
          [ -f "$PROJECT_GRADLE" ] || PROJECT_GRADLE=android/build.gradle

          if grep -q "pluginManagement" "$SETTINGS" 2>/dev/null; then
            if ! grep -q "com.google.gms.google-services" "$SETTINGS"; then
              sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$SETTINGS"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services")' "$APP_GRADLE"
            fi
          else
            if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
              sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
          fi

      - name: Ensure required permissions and manifest entries
        env:
          APP_LABEL: ${{ matrix.label }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          add_permission() {
            if ! grep -q "$1" "$MANIFEST"; then
              sed -i "/<manifest /a\\    <uses-permission android:name=\"$1\" />" "$MANIFEST"
            fi
          }
          add_permission "android.permission.INTERNET"
          add_permission "android.permission.CAMERA"
          add_permission "android.permission.READ_MEDIA_IMAGES"
          add_permission "android.permission.READ_EXTERNAL_STORAGE"
          add_permission "android.permission.RECORD_AUDIO"
          add_permission "android.permission.POST_NOTIFICATIONS"
          add_permission "android.permission.SCHEDULE_EXACT_ALARM"
          add_permission "android.permission.USE_EXACT_ALARM"
          add_permission "android.permission.RECEIVE_BOOT_COMPLETED"
          add_permission "android.permission.VIBRATE"
          add_permission "android.permission.FOREGROUND_SERVICE"
          add_permission "android.permission.FOREGROUND_SERVICE_DATA_SYNC"
          add_permission "android.permission.WAKE_LOCK"

          # Касса ходит к УТМ ЕГАИС по http:// в локальной сети заведения
          # (УТМ не умеет HTTPS) — Android 9+ без этого флага молча
          # блокирует такие запросы.
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

          if ! grep -q "android.hardware.camera" "$MANIFEST"; then
            sed -i "/<manifest /a\\    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />" "$MANIFEST"
          fi

          if ! grep -q "<queries>" "$MANIFEST"; then
            sed -i "/<\/manifest>/i\\    <queries>\n        <intent>\n            <action android:name=\"android.media.action.IMAGE_CAPTURE\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.speech.RecognitionService\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <data android:scheme=\"tel\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.DIAL\" />\n            <data android:scheme=\"tel\" />\n        </intent>\n    </queries>" "$MANIFEST"
          fi

          if ! grep -q "com.google.mlkit.vision.DEPENDENCIES" "$MANIFEST"; then
            sed -i "/<application/,/>/{/>/a\\    <meta-data android:name=\"com.google.mlkit.vision.DEPENDENCIES\" android:value=\"barcode\" />
            }" "$MANIFEST"
          fi

          python3 - "$MANIFEST" <<'PYEOF'
          import sys
          path = sys.argv[1]
          xml = open(path, encoding='utf-8').read()
          if 'flutter_foreground_task' not in xml:
              service = (
                  '        <service\n'
                  '            android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n'
                  '            android:foregroundServiceType="dataSync"\n'
                  '            android:stopWithTask="false"\n'
                  '            android:exported="false" />\n'
              )
              xml = xml.replace('</application>', service + '    </application>', 1)
              open(path, 'w', encoding='utf-8').write(xml)
          if 'ScheduledNotificationReceiver' not in xml:
              receivers = (
                  '        <receiver android:exported="false" '
                  'android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" '
                  'android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
              )
              xml = xml.replace('</application>', receivers + '    </application>', 1)
              open(path, 'w', encoding='utf-8').write(xml)

          # Лейбл под иконкой — общий, эта сборка не привязана к заведению.
          import os, re
          label = os.environ['APP_LABEL']
          xml = open(path, encoding='utf-8').read()
          xml = re.sub(r'android:label="[^"]*"', 'android:label="' + label + '"', xml, count=1)
          open(path, 'w', encoding='utf-8').write(xml)
          PYEOF

          cat "$MANIFEST"

      - name: Enable core library desugaring
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          IS_KTS=1
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE=android/app/build.gradle
            IS_KTS=0
          fi
          python3 - "$APP_GRADLE" "$IS_KTS" <<'PYEOF'
          import re, sys
          path, is_kts = sys.argv[1], sys.argv[2] == '1'
          src = open(path, encoding='utf-8').read()

          if 'isCoreLibraryDesugaringEnabled' not in src and 'coreLibraryDesugaringEnabled' not in src:
              flag = ('        isCoreLibraryDesugaringEnabled = true\n' if is_kts
                      else '        coreLibraryDesugaringEnabled true\n')
              if 'compileOptions' in src:
                  src = re.sub(r'(compileOptions\s*\{)', r'\1\n' + flag.rstrip('\n'), src, count=1)
              else:
                  block = ('    compileOptions {\n' + flag +
                           ('        sourceCompatibility = JavaVersion.VERSION_11\n'
                            '        targetCompatibility = JavaVersion.VERSION_11\n' if is_kts else
                            '        sourceCompatibility JavaVersion.VERSION_11\n'
                            '        targetCompatibility JavaVersion.VERSION_11\n') +
                           '    }\n')
                  src = src.replace('    buildTypes {', block + '    buildTypes {', 1)

          if 'desugar_jdk_libs' not in src:
              dep = ('    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                     if is_kts else
                     "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
              if re.search(r'^dependencies\s*\{', src, re.M):
                  src = re.sub(r'^(dependencies\s*\{)', r'\1\n' + dep, src, count=1, flags=re.M)
              else:
                  src += '\ndependencies {\n' + dep + '\n}\n'

          open(path, 'w', encoding='utf-8').write(src)
          print('desugaring включён')
          PYEOF

      - name: Force bundled (offline) ML Kit barcode model
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          IS_KTS=1
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE=android/app/build.gradle
            IS_KTS=0
          fi
          if ! grep -q "com.google.mlkit:barcode-scanning" "$APP_GRADLE"; then
            if [ "$IS_KTS" = "1" ]; then
              DEP_LINE='    implementation("com.google.mlkit:barcode-scanning:17.3.0")'
            else
              DEP_LINE="    implementation 'com.google.mlkit:barcode-scanning:17.3.0'"
            fi
            if grep -q "^dependencies {" "$APP_GRADLE"; then
              sed -i "/^dependencies {/a\\${DEP_LINE}" "$APP_GRADLE"
            else
              printf '\ndependencies {\n%s\n}\n' "$DEP_LINE" >> "$APP_GRADLE"
            fi
          fi

      - name: Add ProGuard/R8 keep rules for ML Kit and mobile_scanner
        run: |
          RULES=android/app/proguard-rules.pro
          mkdir -p "$(dirname "$RULES")"
          touch "$RULES"
          if ! grep -q "google.mlkit" "$RULES" 2>/dev/null; then
            cat >> "$RULES" <<'EOF'
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode_bundled.** { *; }
          -keep class com.google.mlkit.vision.barcode.** { *; }
          -keep class com.google.mlkit.vision.common.** { *; }
          -keep class com.google.mlkit.common.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          -keep class androidx.camera.** { *; }
          -dontwarn androidx.camera.**
          EOF
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK подписан debug-ключом."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          APP_GRADLE=android/app/build.gradle.kts
          if [ -f "$APP_GRADLE" ]; then
            python3 - "$APP_GRADLE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          if 'keystoreProperties' not in src:
              header = (
                  'import java.util.Properties\n'
                  'import java.io.FileInputStream\n\n'
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              src = header + src
              signing = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String?\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String?\n'
                  '            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n'
                  '            storePassword = keystoreProperties["storePassword"] as String?\n'
                  '        }\n'
                  '    }\n'
              )
              src = src.replace('    buildTypes {', signing + '    buildTypes {', 1)
              src = src.replace('signingConfig = signingConfigs.getByName("debug")',
                                'signingConfig = signingConfigs.getByName("release")')
              open(path, 'w', encoding='utf-8').write(src)
          PYEOF
          else
            echo "::warning::build.gradle.kts не найден — проверьте подпись вручную"
          fi

      - name: Create notification icon
        run: |
          DRAWABLE=android/app/src/main/res/drawable
          mkdir -p "$DRAWABLE"
          # Силуэт смарт-терминала с чеком — как на иконке кассы. Android
          # рисует значок уведомления одним белым цветом, поэтому только контур.
          cat > "$DRAWABLE/ic_notification.xml" <<'XMLEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:fillType="evenOdd"
                android:pathData="M8,2.9L9,2.2L10,2.9L11,2.2L12,2.9L13,2.2L14,2.9L15,2.2L16,2.9V8.3H8Z M9.6,4.6H14.4V5.6H9.6Z M9.6,6.4H13V7.4H9.6Z"/>
            <path
                android:fillColor="#FFFFFFFF"
                android:fillType="evenOdd"
                android:pathData="M6.6,8.9H17.4A2.6,2.6 0 0 1 20,11.5V18.9A2.6,2.6 0 0 1 17.4,21.5H6.6A2.6,2.6 0 0 1 4,18.9V11.5A2.6,2.6 0 0 1 6.6,8.9Z M7,11H17V16.2H7Z M10,18.2H14V19.4H10Z"/>
          </vector>
          XMLEOF

          # Значок уведомления фоновой службы кассы: flutter_foreground_task
          # берёт его по имени meta-data (lib/services/hall_watch_service.dart).
          # Без него служба показывала цветную иконку приложения — Android
          # рисовал её в шторке мутным пятном.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "com.zalpos.notification_icon" "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name="com.zalpos.notification_icon" android:resource="@drawable/ic_notification" />\n    </application>|' "$MANIFEST"
          fi
          KEEP=android/app/src/main/res/raw
          mkdir -p "$KEEP"
          cat > "$KEEP/keep.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/ic_notification" />
          XMLEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: |
          sed -i -E 's|image_path: ".*"|image_path: "${{ matrix.icon }}"|' pubspec.yaml
          sed -i -E 's|adaptive_icon_foreground: ".*"|adaptive_icon_foreground: "${{ matrix.icon_foreground }}"|' pubspec.yaml
          sed -i -E 's|adaptive_icon_background: ".*"|adaptive_icon_background: "${{ matrix.icon_background }}"|' pubspec.yaml
          dart run flutter_launcher_icons

      # Код у сборок общий — тесты один раз.
      - name: Unit tests
        if: matrix.app == 'pos'
        run: flutter test

      - name: Build APK (release, SaaS mode, без привязки к заведению)
        env:
          SAAS_FIREBASE_API_KEY: ${{ secrets.SAAS_FIREBASE_API_KEY }}
          SAAS_FIREBASE_APP_ID: ${{ secrets[matrix.appid_secret] }}
          SAAS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.SAAS_FIREBASE_MESSAGING_SENDER_ID }}
          SAAS_FIREBASE_PROJECT_ID: ${{ secrets.SAAS_FIREBASE_PROJECT_ID }}
          SAAS_FIREBASE_STORAGE_BUCKET: ${{ secrets.SAAS_FIREBASE_STORAGE_BUCKET }}
          PII_GATEWAY_URL: https://pii.zalpos.ru/
          SAAS_GATEWAY_URL: https://pii.zalpos.ru/saas
        run: |
          if [ -z "$SAAS_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Секреты SAAS_FIREBASE_* не заданы — см. saas/README.md, раздел «APK-конвейер»."
            exit 1
          fi
          flutter build apk --release \
            -t ${{ matrix.entrypoint }} \
            --dart-define=SAAS_MODE=true \
            --dart-define=SAAS_GUEST_DEMO=${{ matrix.guest_demo }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=SAAS_FIREBASE_API_KEY="$SAAS_FIREBASE_API_KEY" \
            --dart-define=SAAS_FIREBASE_APP_ID="$SAAS_FIREBASE_APP_ID" \
            --dart-define=SAAS_FIREBASE_MESSAGING_SENDER_ID="$SAAS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=SAAS_FIREBASE_PROJECT_ID="$SAAS_FIREBASE_PROJECT_ID" \
            --dart-define=SAAS_FIREBASE_STORAGE_BUCKET="$SAAS_FIREBASE_STORAGE_BUCKET" \
            --dart-define=PII_GATEWAY_URL="$PII_GATEWAY_URL" \
            --dart-define=SAAS_GATEWAY_URL="$SAAS_GATEWAY_URL"
            # SAAS_PRESET_SLUG/SAAS_PRESET_INVITE_CODE намеренно не заданы —
            # это и есть "универсальная" сборка, см. lib/build_info.dart.

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ matrix.apk_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=public-apk
          FILE=build/app/outputs/flutter-apk/${{ matrix.apk_name }}
          if [ "${{ matrix.app }}" != "pos" ]; then
            # Релиз заводит сборка кассы; приложение гостя только кладёт файл.
            gh release upload "$TAG" "$FILE" --repo "${{ github.repository }}" --clobber \
              || echo "::warning::Релиза public-apk ещё нет — файл гостя попадёт в него со следующей сборкой"
            exit 0
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Файл со старым названием платформы больше не обновляется.
            gh release delete-asset "$TAG" hookah-pos-public.apk --repo "${{ github.repository }}" -y 2>/dev/null || true
            gh release upload "$TAG" "$FILE" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --repo "${{ github.repository }}" \
              --title "ZalPOS — публичная демо-сборка" \
              --notes "Универсальный APK кассы без привязки к заведению — при первом запуске выберите «Демо» или введите код приглашения своего заведения. Файл обновляется автоматически при перезапуске workflow «Публичный APK» (не по версиям, а на месте — старый файл в этом релизе перезаписывается)."
          fi

      # Отдаём файл со своего сервера: с GitHub Releases у части пользователей
      # в России скачивание зависало. Ключ ограничен forced-command
      # deploy-public-apk.sh — он может только записать этот файл.
      - name: Deploy to own server (pii.zalpos.ru)
        if: matrix.app == 'pos'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: pii.zalpos.ru
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::warning::DEPLOY_SSH_KEY не задан — пропускаю доставку на сервер, файл остался только в GitHub Release. См. saas/README.md, раздел «Публичный APK для лендинга»."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@"$SSH_HOST" \
            < build/app/outputs/flutter-apk/zalpos-kassa-demo.apk

      # Демо приложения гостя — тем же скриптом, что и личные сборки
      # (deploy-tenant-apk.sh): папка publicdemo, файл guestdemo.apk. Отдаёт
      # его всем saas-gateway (GET /guestDemoApk) через nginx.
      - name: Deploy guest demo to own server (pii.zalpos.ru)
        if: matrix.app == 'kolibri'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_TENANT }}
          SSH_HOST: pii.zalpos.ru
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::DEPLOY_SSH_KEY_TENANT не задан — демо гостя осталось только в GitHub Release."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_tenant_key
          chmod 600 ~/.ssh/deploy_tenant_key
          ssh -i ~/.ssh/deploy_tenant_key -o StrictHostKeyChecking=no root@"$SSH_HOST" "publicdemo guestdemo" \
            < build/app/outputs/flutter-apk/zalpos-guest-demo.apk

  # Демо-касса для Windows: тот же lib/main.dart, что и APK кассы выше, без
  # кодов заведения — при первом запуске «Демо» или код своего заведения.
  # Шаги — как у Windows-сборки заведения (saas-on-demand-build.yml,
  # job build-windows): правя одну, проверьте и другую. Установщик тот же
  # (AppId общий), поэтому касса заведения потом ставится поверх демо.
  build-windows:
    runs-on: windows-latest
    name: Build public demo (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop support
        shell: bash
        run: flutter config --enable-windows-desktop

      - name: Generate missing Windows platform files
        shell: bash
        run: |
          flutter create . --platforms=windows
          test -d windows && echo "windows/ готова" || (echo "не удалось создать windows/" && exit 1)
          sed -i 's/L"hookah_pos"/L"ZalPOS"/' windows/runner/main.cpp
          sed -i -E 's/(VALUE "(FileDescription|ProductName)", )"hookah_pos"/\1"ZalPOS"/' windows/runner/Runner.rc
          grep -n 'ZalPOS' windows/runner/main.cpp windows/runner/Runner.rc || echo "::warning::заголовок окна не заменён"
          cp assets/icon/app_icon.ico windows/runner/resources/app_icon.ico
          rm -f test/widget_test.dart

      - name: Install dependencies
        shell: bash
        run: flutter pub get

      # Ошибка плагина cloud_firestore для Windows (подробности — в скрипте).
      - name: Patch cloud_firestore (Windows)
        shell: bash
        run: node .github/scripts/patch-firestore-windows.js

      # Тесты уже прогнала сборка APK кассы — код общий.
      - name: Build Windows (release, SaaS mode, без привязки к заведению)
        shell: bash
        env:
          PII_GATEWAY_URL: https://pii.zalpos.ru/
          SAAS_GATEWAY_URL: https://pii.zalpos.ru/saas
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          CXXFLAGS: -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter build windows --release \
            -t lib/main.dart \
            --build-number=${{ github.run_number }} \
            --dart-define=SAAS_MODE=true \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=PII_GATEWAY_URL="$PII_GATEWAY_URL" \
            --dart-define=SAAS_GATEWAY_URL="$SAAS_GATEWAY_URL"

      - name: Locate Release output folder
        id: outdir
        shell: bash
        run: |
          DIR=""
          while IFS= read -r d; do
            if [ -f "$d/flutter_windows.dll" ] && [ -d "$d/data" ] && ls "$d"/*.exe >/dev/null 2>&1; then
              DIR="$d"; break
            fi
          done < <(find build/windows -type d -path '*/runner/Release')
          if [ -z "$DIR" ]; then
            echo "::error::Не нашли готовую папку runner/Release (exe + flutter_windows.dll + data)"
            find build/windows -maxdepth 4 -type d | head -50
            exit 1
          fi
          echo "path=$DIR" >> "$GITHUB_OUTPUT"

      # Установщик: ярлыки, удаление через «Приложения», без прав
      # администратора. Библиотеки Visual C++ — рядом с exe, иначе на
      # «чистом» компьютере касса не запустится.
      - name: Build Windows installer (setup.exe)
        id: setup
        shell: pwsh
        run: |
          $out = (Resolve-Path "${{ steps.outdir.outputs.path }}").Path
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $out -Force }
          }
          $exe = (Get-ChildItem $out -Filter *.exe | Select-Object -First 1).Name
          if (-not $exe) { Write-Error "В папке сборки нет exe"; exit 1 }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup не установлен"; exit 1 }

          $dist = (New-Item -ItemType Directory -Force -Path "build/windows/installer").FullName
          $setupIcon = (Resolve-Path "assets/icon/app_icon.ico").Path
          $name = "zalpos-kassa-demo-setup"
          $iss = @"
          [Setup]
          AppId={{6F1C2A9E-3B7D-4E5A-9C41-5A7D3E2B9C10}
          AppName=ZalPOS
          AppVersion=1.0.${{ github.run_number }}
          AppPublisher=ZalPOS
          DefaultDirName={autopf}\ZalPOS
          DefaultGroupName=ZalPOS
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=$dist
          OutputBaseFilename=$name
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\$exe
          SetupIconFile=$setupIcon
          CloseApplications=yes

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Ярлык на рабочем столе"; GroupDescription: "Дополнительно:"

          [Files]
          Source: "$out\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\ZalPOS"; Filename: "{app}\$exe"
          Name: "{autodesktop}\ZalPOS"; Filename: "{app}\$exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\$exe"; Description: "Запустить ZalPOS"; Flags: nowait postinstall skipifsilent
          "@
          $issPath = Join-Path $dist "zalpos_demo.iss"
          # С BOM — иначе русские подписи установщика превратятся в «кракозябры».
          [System.IO.File]::WriteAllText($issPath, $iss, (New-Object System.Text.UTF8Encoding $true))
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC завершился с ошибкой $LASTEXITCODE"; exit 1 }

          $setup = Join-Path $dist "$name.exe"
          if (-not (Test-Path $setup) -or (Get-Item $setup).Length -lt 1MB) {
            Write-Error "Установщик не создан или подозрительно мал: $setup"
            exit 1
          }
          Write-Host ("Установщик: {0} ({1:N1} МБ)" -f $setup, ((Get-Item $setup).Length / 1MB))
          echo "path=$setup" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload public-apk "${{ steps.setup.outputs.path }}" --repo "${{ github.repository }}" --clobber \
            || echo "::warning::Релиза public-apk ещё нет — установщик попадёт в него со следующей сборкой"

      # Тем же скриптом deploy-tenant-apk.sh, что и демо гостя: папка
      # publicdemo, файл kassawin.apk (на диске имя всегда *.apk, тип для
      # браузера задаёт GET /saas/windowsDemo).
      - name: Deploy to own server (pii.zalpos.ru)
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_TENANT }}
          SSH_HOST: pii.zalpos.ru
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::DEPLOY_SSH_KEY_TENANT не задан — демо для Windows осталось только в GitHub Release."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_tenant_key
          chmod 600 ~/.ssh/deploy_tenant_key
          ssh -i ~/.ssh/deploy_tenant_key -o StrictHostKeyChecking=no root@"$SSH_HOST" "publicdemo kassawin" \
            < "${{ steps.setup.outputs.path }}"
