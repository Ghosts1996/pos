name: Фото для демо-меню

# Временный: подбирает живые фото блюд демо-меню с Unsplash (см.
# tmp/demo-photos/fetch.py). Пока нет choices.json — варианты на выбор
# (листы-превью), с choices.json — выбранные фото в saas/console/demo-menu.
# only.txt — подобрать заново только эти блюда (через запятую).
on:
  push:
    branches: [claude/dazzling-babbage-n65p6l]
    paths:
      - 'tmp/demo-photos/queries.json'
      - 'tmp/demo-photos/only.txt'
      - 'tmp/demo-photos/choices.json'
      - '.github/workflows/demo-photos.yml'

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow requests
      - name: Подобрать фото
        run: |
          [ -d tmp/demo-photos ] || { echo "нечего делать"; exit 0; }
          MODE=candidates; [ -f tmp/demo-photos/choices.json ] && MODE=final
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          ONLY="$(cat tmp/demo-photos/only.txt 2>/dev/null || true)" python tmp/demo-photos/fetch.py "$MODE"
      - name: Сохранить в ветку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp saas/console/demo-menu
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -q -m "Демо-меню: фото с Unsplash ($MODE)"
          git push
