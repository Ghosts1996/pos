name: SaaS on-demand APK build

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'ID заведения (tenants/{tenantId}) — под каким заведением искать готовый APK на сервере'
        required: true
      job_id_pos:
        description: 'ID документа buildJobs/{jobId} для сборки кассы (matrix.app == pos)'
        required: true
      job_id_kolibri:
        description: 'ID документа buildJobs/{jobId} для сборки гостевого приложения «Colibri Lounge» (matrix.app == kolibri)'
        required: true
      app_label:
        description: 'Имя гостевого приложения заведения (branding.appName, раздел «Брендинг») — касса его игнорирует, у неё фиксированное имя "Hookah POS"; пусто = дефолт "Colibri Lounge"'
        required: false
      logo_url:
        description: 'URL логотипа заведения (branding.logoUrl) — иконка ТОЛЬКО гостевого приложения, касса всегда со своей иконкой платформы; пусто = общая иконка "Colibri Lounge"'
        required: false
      tenant_slug:
        description: 'Код заведения (tenants.slug) — если задан вместе с invite_code, собранный APK сам присоединится к этому заведению при первом запуске, без ручного ввода кодов'
        required: false
      invite_code:
        description: 'Код приглашения устройства (settings/deviceInvite.code) заведения — см. tenant_slug'
        required: false
  # ВРЕМЕННО, только чтобы GitHub впервые "увидел" этот workflow — до первого
  # запуска (любым способом) API workflow_dispatch отвечает 404 "workflow не
  # найден" даже с правильным ref, см. тот же трюк для public-apk-release.yml.
  # Job ниже пропускает себя (if: github.event_name == 'workflow_dispatch'),
  # поэтому push реального запуска сборки не вызывает — только регистрирует
  # файл. Удалить этот push-триггер после первого успешного дёрганья
  # workflow_dispatch (см. историю коммитов).
  push:
    branches: [claude/pos-continued]
    paths: ['.github/workflows/saas-on-demand-build.yml']

# Запускается ТОЛЬКО createBuildJob в saas-gateway/server.js (Node-сервис на
# собственном сервере, не Cloud Function — Blaze для неё недоступен, см. её
# же docstring) через GitHub REST API "workflow_dispatch" — не по push и не
# вручную с обычными правами: personal access token с правом Actions: write
# хранится в /etc/saas-gateway.env на сервере, не здесь.
#
# Технически один и тот же универсальный код для ВСЕХ арендаторов платформы
# (SAAS_MODE=true, ключи SaaS-проекта Firebase, SaasDevicePairingScreen —
# код заведения + код приглашения устройства, см. lib/main.dart и
# saas/README.md) — но КАЖДАЯ сборка личная: tenant_slug+invite_code
# запекаются как SAAS_PRESET_SLUG/SAAS_PRESET_INVITE_CODE — с ними экран
# присоединения сам подключается к заведению владельца при первом запуске,
# без ручного ввода кодов (см. saas_device_pairing_screen.dart). Доступ к
# самому файлу тоже ограничен per-tenant — см. handleDownloadBuild в
# saas-gateway/server.js.
#
# ВАЖНО про бренд: app_label/logo_url (брендинг заведения) применяются
# ТОЛЬКО к гостевому приложению — касса жёстко остаётся брендом платформы
# ("Hookah POS", своя иконка), не арендатора (см. env: у шагов "Ensure
# required permissions..."/"Generate app launcher icon" ниже — там же и
# почему). Раньше касса тоже подхватывала лейбл/иконку заведения — это
# было ошибкой: касса не витрина арендатора, а инструмент персонала,
# должна выглядеть одинаково у всех заведений платформы.
#
# ОДИН запуск — ДВА приложения (матрица ниже, по образцу build-apk.yml):
# касса (lib/main.dart, com.hookahpossaas) и гостевое приложение «Colibri
# Lounge» для гостей заведения (lib/client/kolibri_main.dart,
# com.kolibriloungesaas) — тот же принцип "одна сборка — два приложения",
# что и в продовом build-apk.yml, только оба здесь ещё и подключаются к
# КОНКРЕТНОМУ заведению через SAAS_PRESET_SLUG (см. docstring в
# lib/client/kolibri_main.dart: гостю, в отличие от кассы, вводить код
# заведения негде и незачем — эта сборка личная). У каждого приложения
# СВОЙ Firebase Android app внутри одного SaaS-проекта (разные applicationId
# нельзя зарегистрировать под одним app id) — см. saas/README.md, раздел
# «APK-конвейер», про секреты *_KOLIBRI.
#
# ЭТОТ ФАЙЛ НАМЕРЕННО ОТДЕЛЬНЫЙ от build-apk.yml, а не объединён с ним через
# общий composite action, и часть Android-шагов ниже дублирует его (сама
# структура матрицы — намеренное заимствование оттуда, а не копипаста
# случайно разошедшегося кода). build-apk.yml собирает боевые одно-арендные
# APK текущего живого заведения — трогать его ради SaaS-варианта, который
# ему не нужен, значило бы рисковать реальной, годами обкатанной сборкой
# ради фичи, которая с ней не связана. Если здесь найдётся баг того же
# рода, что уже пойман и прокомментирован в build-apk.yml (ML Kit, R8,
# desugaring, App Links и т.д.), правьте оба файла — они специально не
# разделяют код.
jobs:
  build:
    # push-триггер выше — только чтобы GitHub зарегистрировал workflow (см.
    # комментарий там же). Реальная сборка требует tenant_id/job_id_*,
    # которых push-событие не передаёт — поэтому push-запуски пропускаются.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pos
            entrypoint: lib/main.dart
            project_name: hookahpossaas          # applicationId = com.hookahpossaas
            application_id: com.hookahpossaas
            gservices_secret: GOOGLE_SERVICES_JSON_SAAS
            appid_secret: SAAS_FIREBASE_APP_ID
            default_icon: assets/icon/icon.png
            default_adaptive_icon: assets/icon/icon_foreground.png
            default_label: 'Hookah POS'
            artifact_prefix: hookah-pos-saas
          - app: kolibri
            entrypoint: lib/client/kolibri_main.dart
            project_name: kolibriloungesaas       # applicationId = com.kolibriloungesaas
            application_id: com.kolibriloungesaas
            gservices_secret: GOOGLE_SERVICES_JSON_SAAS_KOLIBRI
            appid_secret: SAAS_FIREBASE_APP_ID_KOLIBRI
            default_icon: assets/icon/kolibri.png
            default_adaptive_icon: assets/icon/kolibri_foreground.png
            default_label: 'Colibri Lounge'
            artifact_prefix: colibri-lounge-saas
    name: Build ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-saas-${{ matrix.app }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate missing Android platform files
        run: |
          # --project-name разный для каждого приложения матрицы: одинаковый
          # applicationId у двух приложений в одном Firebase-проекте
          # невозможен (см. шапку файла) — ни в консоли, ни физически на
          # одном устройстве (второй APK затёр бы первый при установке).
          flutter create . --platforms=android --org com --project-name ${{ matrix.project_name }}
          test -d android && echo "android/ готова" || (echo "не удалось создать android/" && exit 1)

          # flutter create кладёт в test/ свой шаблонный widget_test.dart,
          # который импортирует несуществующий здесь package:${{ matrix.project_name }}/main.dart —
          # валит шаг тестов. Файл в репозитории не хранится.
          rm -f test/widget_test.dart

      - name: Bump compileSdk for CameraX / mobile_scanner compatibility
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          sed -i -E 's/compileSdk[[:space:]]*=.*/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$APP_GRADLE"
          grep -E "compileSdk" "$APP_GRADLE"

      - name: Add google-services.json (SaaS Firebase project)
        env:
          GSERVICES: ${{ secrets[matrix.gservices_secret] }}
        run: |
          # Приложение matrix.application_id должно быть зарегистрировано в
          # ВАШЕМ SaaS Firebase-проекте (Project settings → Your apps) —
          # НЕ в hoocah-pos. См. saas/README.md, раздел «APK-конвейер».
          # Секрет свой на каждое приложение матрицы (GOOGLE_SERVICES_JSON_SAAS
          # / GOOGLE_SERVICES_JSON_SAAS_KOLIBRI) — это два РАЗНЫХ
          # зарегистрированных Android-приложения внутри одного и того же
          # Firebase-проекта, у каждого свой google-services.json.
          if [ -z "$GSERVICES" ]; then
            echo "::error::Секрет ${{ matrix.gservices_secret }} не задан (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$GSERVICES" > android/app/google-services.json
          grep -q "${{ matrix.application_id }}" android/app/google-services.json \
            || (echo "::error::В ${{ matrix.gservices_secret }} нет приложения ${{ matrix.application_id }}" && exit 1)

      - name: Apply Google Services Gradle plugin
        run: |
          SETTINGS=android/settings.gradle.kts
          [ -f "$SETTINGS" ] || SETTINGS=android/settings.gradle
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          PROJECT_GRADLE=android/build.gradle.kts
          [ -f "$PROJECT_GRADLE" ] || PROJECT_GRADLE=android/build.gradle

          if grep -q "pluginManagement" "$SETTINGS" 2>/dev/null; then
            if ! grep -q "com.google.gms.google-services" "$SETTINGS"; then
              sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$SETTINGS"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services")' "$APP_GRADLE"
            fi
          else
            if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
              sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
          fi

      - name: Ensure required permissions and manifest entries
        env:
          # Каждый арендатор настраивает бренд СВОЕГО гостевого приложения в
          # разделе «Брендинг» (имя, лого, цвета) — касса ЖЁСТКО остаётся
          # брендом платформы (Hookah POS), не арендатора, поэтому для
          # matrix.app == pos ниже APP_LABEL принудительно очищается, а не
          # приходит из inputs.app_label вообще.
          APP_LABEL: ${{ matrix.app == 'pos' && '' || inputs.app_label }}
          DEFAULT_LABEL: ${{ matrix.default_label }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          add_permission() {
            if ! grep -q "$1" "$MANIFEST"; then
              sed -i "/<manifest /a\\    <uses-permission android:name=\"$1\" />" "$MANIFEST"
            fi
          }
          add_permission "android.permission.INTERNET"
          add_permission "android.permission.CAMERA"
          add_permission "android.permission.READ_MEDIA_IMAGES"
          add_permission "android.permission.READ_EXTERNAL_STORAGE"
          add_permission "android.permission.RECORD_AUDIO"
          add_permission "android.permission.POST_NOTIFICATIONS"
          add_permission "android.permission.SCHEDULE_EXACT_ALARM"
          add_permission "android.permission.USE_EXACT_ALARM"
          add_permission "android.permission.RECEIVE_BOOT_COMPLETED"
          add_permission "android.permission.VIBRATE"
          add_permission "android.permission.FOREGROUND_SERVICE"
          add_permission "android.permission.FOREGROUND_SERVICE_DATA_SYNC"
          add_permission "android.permission.WAKE_LOCK"

          if ! grep -q "android.hardware.camera" "$MANIFEST"; then
            sed -i "/<manifest /a\\    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />" "$MANIFEST"
          fi

          if ! grep -q "<queries>" "$MANIFEST"; then
            sed -i "/<\/manifest>/i\\    <queries>\n        <intent>\n            <action android:name=\"android.media.action.IMAGE_CAPTURE\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.speech.RecognitionService\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <data android:scheme=\"tel\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.DIAL\" />\n            <data android:scheme=\"tel\" />\n        </intent>\n    </queries>" "$MANIFEST"
          fi

          if ! grep -q "com.google.mlkit.vision.DEPENDENCIES" "$MANIFEST"; then
            sed -i "/<application/,/>/{/>/a\\    <meta-data android:name=\"com.google.mlkit.vision.DEPENDENCIES\" android:value=\"barcode\" />
            }" "$MANIFEST"
          fi

          python3 - "$MANIFEST" <<'PYEOF'
          import os, re, sys
          path = sys.argv[1]
          xml = open(path, encoding='utf-8').read()
          if 'flutter_foreground_task' not in xml:
              service = (
                  '        <service\n'
                  '            android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n'
                  '            android:foregroundServiceType="dataSync"\n'
                  '            android:stopWithTask="false"\n'
                  '            android:exported="false" />\n'
              )
              xml = xml.replace('</application>', service + '    </application>', 1)
              open(path, 'w', encoding='utf-8').write(xml)
          if 'ScheduledNotificationReceiver' not in xml:
              receivers = (
                  '        <receiver android:exported="false" '
                  'android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" '
                  'android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
              )
              xml = xml.replace('</application>', receivers + '    </application>', 1)
              open(path, 'w', encoding='utf-8').write(xml)

          # Лейбл под иконкой на телефоне — для matrix.app == pos APP_LABEL
          # приходит уже принудительно пустым (см. env: этого шага) — касса
          # всегда "Hookah POS", бренд платформы, не арендатора. Для
          # гостевого приложения — из branding.appName заведения
          # (createBuildJob подставляет его сюда, см. saas-gateway/server.js).
          # Санитизация тут, а не только на сервере, — потому что
          # workflow_dispatch technically можно дёрнуть и не через
          # createBuildJob, а значений оттуда доверять нельзя вслепую (это
          # идёт прямо в XML-атрибут манифеста).
          label = (os.environ.get('APP_LABEL') or '').strip()
          label = re.sub(r'[^\w .,()&-]', '', label, flags=re.UNICODE).strip()[:30]
          if not label:
              label = os.environ.get('DEFAULT_LABEL') or 'Hookah POS'
          label = (label.replace('&', '&amp;').replace('<', '&lt;')
                        .replace('>', '&gt;').replace('"', '&quot;').replace("'", '&apos;'))
          xml = open(path, encoding='utf-8').read()
          xml = re.sub(r'android:label="[^"]*"', 'android:label="' + label + '"', xml, count=1)
          open(path, 'w', encoding='utf-8').write(xml)
          PYEOF

          cat "$MANIFEST"

      - name: Enable core library desugaring
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          IS_KTS=1
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE=android/app/build.gradle
            IS_KTS=0
          fi
          python3 - "$APP_GRADLE" "$IS_KTS" <<'PYEOF'
          import re, sys
          path, is_kts = sys.argv[1], sys.argv[2] == '1'
          src = open(path, encoding='utf-8').read()

          if 'isCoreLibraryDesugaringEnabled' not in src and 'coreLibraryDesugaringEnabled' not in src:
              flag = ('        isCoreLibraryDesugaringEnabled = true\n' if is_kts
                      else '        coreLibraryDesugaringEnabled true\n')
              if 'compileOptions' in src:
                  src = re.sub(r'(compileOptions\s*\{)', r'\1\n' + flag.rstrip('\n'), src, count=1)
              else:
                  block = ('    compileOptions {\n' + flag +
                           ('        sourceCompatibility = JavaVersion.VERSION_11\n'
                            '        targetCompatibility = JavaVersion.VERSION_11\n' if is_kts else
                            '        sourceCompatibility JavaVersion.VERSION_11\n'
                            '        targetCompatibility JavaVersion.VERSION_11\n') +
                           '    }\n')
                  src = src.replace('    buildTypes {', block + '    buildTypes {', 1)

          if 'desugar_jdk_libs' not in src:
              dep = ('    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                     if is_kts else
                     "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
              if re.search(r'^dependencies\s*\{', src, re.M):
                  src = re.sub(r'^(dependencies\s*\{)', r'\1\n' + dep, src, count=1, flags=re.M)
              else:
                  src += '\ndependencies {\n' + dep + '\n}\n'

          open(path, 'w', encoding='utf-8').write(src)
          print('desugaring включён')
          PYEOF

      - name: Force bundled (offline) ML Kit barcode model
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          IS_KTS=1
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE=android/app/build.gradle
            IS_KTS=0
          fi
          if ! grep -q "com.google.mlkit:barcode-scanning" "$APP_GRADLE"; then
            if [ "$IS_KTS" = "1" ]; then
              DEP_LINE='    implementation("com.google.mlkit:barcode-scanning:17.3.0")'
            else
              DEP_LINE="    implementation 'com.google.mlkit:barcode-scanning:17.3.0'"
            fi
            if grep -q "^dependencies {" "$APP_GRADLE"; then
              sed -i "/^dependencies {/a\\${DEP_LINE}" "$APP_GRADLE"
            else
              printf '\ndependencies {\n%s\n}\n' "$DEP_LINE" >> "$APP_GRADLE"
            fi
          fi

      - name: Add ProGuard/R8 keep rules for ML Kit and mobile_scanner
        run: |
          RULES=android/app/proguard-rules.pro
          mkdir -p "$(dirname "$RULES")"
          touch "$RULES"
          if ! grep -q "google.mlkit" "$RULES" 2>/dev/null; then
            cat >> "$RULES" <<'EOF'
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode_bundled.** { *; }
          -keep class com.google.mlkit.vision.barcode.** { *; }
          -keep class com.google.mlkit.vision.common.** { *; }
          -keep class com.google.mlkit.common.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          -keep class androidx.camera.** { *; }
          -dontwarn androidx.camera.**
          EOF
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Тот же постоянный ключ, что и у продовых сборок build-apk.yml —
          # это другое приложение (другой applicationId), App Links здесь
          # не нужны, а отдельный keystore ради ещё одного приложения того
          # же издателя не даёт разработчику ничего, кроме лишнего секрета
          # для ротации.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK подписан debug-ключом."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          APP_GRADLE=android/app/build.gradle.kts
          if [ -f "$APP_GRADLE" ]; then
            python3 - "$APP_GRADLE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          if 'keystoreProperties' not in src:
              header = (
                  'import java.util.Properties\n'
                  'import java.io.FileInputStream\n\n'
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              src = header + src
              signing = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String?\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String?\n'
                  '            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n'
                  '            storePassword = keystoreProperties["storePassword"] as String?\n'
                  '        }\n'
                  '    }\n'
              )
              src = src.replace('    buildTypes {', signing + '    buildTypes {', 1)
              src = src.replace('signingConfig = signingConfigs.getByName("debug")',
                                'signingConfig = signingConfigs.getByName("release")')
              open(path, 'w', encoding='utf-8').write(src)
          PYEOF
          else
            echo "::warning::build.gradle.kts не найден — проверьте подпись вручную"
          fi

      - name: Create notification icon
        run: |
          DRAWABLE=android/app/src/main/res/drawable
          mkdir -p "$DRAWABLE"
          cat > "$DRAWABLE/ic_notification.xml" <<'XMLEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M10.6,3.2h2.8v11.2h-2.8z"/>
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M12,18.6m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0"/>
          </vector>
          XMLEOF
          KEEP=android/app/src/main/res/raw
          mkdir -p "$KEEP"
          cat > "$KEEP/keep.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/ic_notification" />
          XMLEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        env:
          # Иконка из логотипа заведения — ТОЛЬКО для гостевого приложения
          # (matrix.app == kolibri); касса всегда со своей иконкой платформы
          # (assets/icon/icon.png), поэтому для pos LOGO_URL принудительно
          # пустой независимо от того, что было в inputs.logo_url.
          LOGO_URL: ${{ matrix.app == 'pos' && '' || inputs.logo_url }}
          DEFAULT_ICON: ${{ matrix.default_icon }}
          DEFAULT_ADAPTIVE_ICON: ${{ matrix.default_adaptive_icon }}
        run: |
          use_default_icon() {
            sed -i -E "s|image_path: \".*\"|image_path: \"$DEFAULT_ICON\"|" pubspec.yaml
            sed -i -E "s|adaptive_icon_foreground: \".*\"|adaptive_icon_foreground: \"$DEFAULT_ADAPTIVE_ICON\"|" pubspec.yaml
            dart run flutter_launcher_icons
          }
          # Логотип заведения (branding.logoUrl, загружается владельцем в
          # разделе «Брендинг») — если задан и реально скачивается, иконка
          # гостевого приложения генерируется из него. Любая неудача (нет
          # логотипа, битый файл, сеть) откатывается на общую иконку
          # "Colibri Lounge" — сборка не должна падать из-за проблемы с
          # картинкой, которую владелец когда-то неудачно загрузил.
          if [ -n "$LOGO_URL" ] && curl -fsSL --max-time 20 "$LOGO_URL" -o /tmp/tenant_logo.png && [ -s /tmp/tenant_logo.png ]; then
            sed -i -E 's|image_path: ".*"|image_path: "/tmp/tenant_logo.png"|' pubspec.yaml
            sed -i -E 's|adaptive_icon_foreground: ".*"|adaptive_icon_foreground: "/tmp/tenant_logo.png"|' pubspec.yaml
            if ! dart run flutter_launcher_icons; then
              echo "::warning::Не удалось собрать иконку из логотипа заведения — используется общая иконка"
              use_default_icon
            fi
          else
            use_default_icon
          fi

      - name: Unit tests
        run: flutter test

      - name: Build APK (release, SaaS mode)
        env:
          SAAS_FIREBASE_API_KEY: ${{ secrets.SAAS_FIREBASE_API_KEY }}
          SAAS_FIREBASE_APP_ID: ${{ secrets[matrix.appid_secret] }}
          SAAS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.SAAS_FIREBASE_MESSAGING_SENDER_ID }}
          SAAS_FIREBASE_PROJECT_ID: ${{ secrets.SAAS_FIREBASE_PROJECT_ID }}
          SAAS_FIREBASE_STORAGE_BUCKET: ${{ secrets.SAAS_FIREBASE_STORAGE_BUCKET }}
          PII_GATEWAY_URL: ${{ secrets.PII_GATEWAY_URL }}
          SAAS_GATEWAY_URL: ${{ secrets.SAAS_GATEWAY_URL }}
          # env:, не прямая интерполяция ${{ }} в run: — inputs.* приходят от
          # вызывающего (обычно saas-gateway, но workflow_dispatch technically
          # можно дёрнуть и напрямую), доверять им как части shell-команды
          # нельзя, только как значению переменной окружения.
          TENANT_SLUG: ${{ inputs.tenant_slug }}
          INVITE_CODE: ${{ inputs.invite_code }}
        run: |
          if [ -z "$SAAS_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Секреты SAAS_FIREBASE_* не заданы — см. saas/README.md, раздел «APK-конвейер»."
            exit 1
          fi
          if [ -z "$SAAS_FIREBASE_APP_ID" ]; then
            echo "::error::Секрет ${{ matrix.appid_secret }} не задан — см. saas/README.md, раздел «APK-конвейер»."
            exit 1
          fi
          # INVITE_CODE прокидывается и в сборку гостевого приложения тоже —
          # там она просто не используется (см. lib/client/kolibri_main.dart:
          # гостю, в отличие от кассы, код приглашения не нужен вообще), так
          # что проще передавать одинаково в обе, чем городить matrix-условие
          # только ради одной лишней переменной окружения без эффекта.
          flutter build apk --release \
            -t ${{ matrix.entrypoint }} \
            --dart-define=SAAS_MODE=true \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=SAAS_FIREBASE_API_KEY="$SAAS_FIREBASE_API_KEY" \
            --dart-define=SAAS_FIREBASE_APP_ID="$SAAS_FIREBASE_APP_ID" \
            --dart-define=SAAS_FIREBASE_MESSAGING_SENDER_ID="$SAAS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=SAAS_FIREBASE_PROJECT_ID="$SAAS_FIREBASE_PROJECT_ID" \
            --dart-define=SAAS_FIREBASE_STORAGE_BUCKET="$SAAS_FIREBASE_STORAGE_BUCKET" \
            --dart-define=PII_GATEWAY_URL="$PII_GATEWAY_URL" \
            --dart-define=SAAS_GATEWAY_URL="$SAAS_GATEWAY_URL" \
            --dart-define=SAAS_PRESET_SLUG="$TENANT_SLUG" \
            --dart-define=SAAS_PRESET_INVITE_CODE="$INVITE_CODE"

      - name: Resolve job id for this matrix leg
        id: jobid
        # always() — этот шаг должен отработать даже если что-то раньше
        # (сборка, тесты) уже упало: "Report failure to buildJobs" ниже
        # тоже использует steps.jobid.outputs.value, и без always() при
        # сбое ДО этого шага он остался бы пустым — отчёт о провале ушёл бы
        # с пустым jobId и не долетел бы ни до одного buildJobs-документа,
        # оставив запись в консоли вечно висеть "в очереди".
        if: always()
        run: |
          if [ "${{ matrix.app }}" = "pos" ]; then
            echo "value=${{ inputs.job_id_pos }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.job_id_kolibri }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        id: rename
        run: |
          # Имя файла — {job_id}.apk, свой на каждое приложение матрицы
          # (см. предыдущий шаг) — handleDownloadBuild в saas-gateway/server.js
          # ищет файл именно по jobId соответствующего buildJobs-документа.
          OUT="build/app/outputs/flutter-apk/${{ steps.jobid.outputs.value }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact (GitHub Actions run log)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ steps.jobid.outputs.value }}
          path: ${{ steps.rename.outputs.path }}

      # Артефакт GitHub Actions выше виден только тем, у кого есть доступ к
      # этому репозиторию (не владельцу заведения) — реальная точка выдачи
      # APK владельцу это собственный сервер платформы (pii.hookahpos.su),
      # НЕ Firebase Storage: у saas-3bdc8 Storage требует план Blaze,
      # которого нет (та же причина, что и у публичного APK — см. её же
      # комментарий в public-apk-release.yml и PUBLIC_APK_URL в
      # saas/console/console.js). В отличие от публичного APK эта сборка
      # ЛИЧНАЯ (лого/название заведения), поэтому раздаётся не статикой
      # через nginx, а через saas-gateway (GET /downloadBuild) с проверкой
      # Firebase Auth + роли owner/admin в заведении — см.
      # handleDownloadBuild в saas-gateway/server.js.
      #
      # Отдельный от DEPLOY_SSH_KEY (публичный APK) ключ с СВОИМ forced
      # command (authorized_keys: command="/usr/local/bin/deploy-tenant-apk.sh",
      # restrict) — тот ключ физически не может положить файл сюда, и
      # наоборот, даже если один из них утечёт. tenant_id/job_id идут в
      # SSH-команду через переменные окружения, а не прямой интерполяцией
      # ${{ }} в run: — inputs.* нельзя доверять как части shell-команды
      # (см. тот же комментарий у шага "Build APK" выше); сервер тоже
      # проверяет их формат перед использованием в пути (см. saas/README.md,
      # раздел «APK-конвейер»).
      - name: Deploy APK to own server (pii.hookahpos.su)
        if: success()
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_TENANT }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          TENANT_ID: ${{ inputs.tenant_id }}
          JOB_ID: ${{ steps.jobid.outputs.value }}
          APK_PATH: ${{ steps.rename.outputs.path }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::DEPLOY_SSH_KEY_TENANT/DEPLOY_SSH_HOST не заданы — без них личные сборки некуда доставлять. См. saas/README.md, раздел «APK-конвейер»."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_tenant_key
          chmod 600 ~/.ssh/deploy_tenant_key
          ssh -i ~/.ssh/deploy_tenant_key -o StrictHostKeyChecking=no root@"$SSH_HOST" \
            "$TENANT_ID $JOB_ID" \
            < "$APK_PATH"

      # SAAS_COMPLETE_BUILD_JOB_URL — полный url эндпоинта completeBuildJob
      # своего сервиса (см. saas-gateway/README.md), например
      # https://pii.hookahpos.su/saas/completeBuildJob — не Cloud Function
      # (Blaze для неё сейчас недоступен, см. docstring в saas-gateway/server.js).
      # downloadPath тут уже не путь в Storage, а просто пометка для
      # истории/отладки — саму раздачу handleDownloadBuild строит из
      # tenantId/jobId самого buildJobs-документа, downloadPath не читает.
      - name: Report success to buildJobs
        if: success()
        run: |
          curl -sS -X POST "${{ secrets.SAAS_COMPLETE_BUILD_JOB_URL }}" \
            -H "Content-Type: application/json" \
            -H "x-callback-secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -d "{\"jobId\":\"${{ steps.jobid.outputs.value }}\",\"status\":\"success\",\"downloadPath\":\"tenant-builds/${{ inputs.tenant_id }}/${{ steps.jobid.outputs.value }}.apk\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Report failure to buildJobs
        if: failure()
        run: |
          curl -sS -X POST "${{ secrets.SAAS_COMPLETE_BUILD_JOB_URL }}" \
            -H "Content-Type: application/json" \
            -H "x-callback-secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -d "{\"jobId\":\"${{ steps.jobid.outputs.value }}\",\"status\":\"failed\",\"errorMessage\":\"Сборка упала — подробности в логе запуска (${{ matrix.app }}).\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
