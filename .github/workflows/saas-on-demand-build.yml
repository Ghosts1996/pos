name: SaaS on-demand APK build

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'ID заведения (tenants/{tenantId}) — под каким заведением искать готовый APK на сервере'
        required: true
      job_id_pos:
        description: 'ID документа buildJobs/{jobId} для сборки кассы (matrix.app == pos)'
        required: true
      job_id_kolibri:
        description: 'ID документа buildJobs/{jobId} для сборки гостевого приложения (matrix.app == kolibri)'
        required: true
      job_id_pos_windows:
        description: 'ID документа buildJobs/{jobId} для Windows-сборки кассы (job build-windows ниже, отдельно от матрицы Android)'
        required: true
      app_label:
        description: 'Имя гостевого приложения заведения (branding.appName, раздел «Брендинг») — касса его игнорирует, у неё фиксированное имя "ZalPOS"; пусто = название заведения'
        required: false
      logo_url:
        description: 'URL логотипа заведения (branding.logoUrl) — иконка ТОЛЬКО гостевого приложения, касса всегда со своей иконкой платформы; пусто = фирменный знак ZalPOS «◆»'
        required: false
      tenant_slug:
        description: 'Код заведения (tenants.slug) — если задан вместе с invite_code, собранный APK сам присоединится к этому заведению при первом запуске, без ручного ввода кодов'
        required: false
      invite_code:
        description: 'Код приглашения устройства (settings/deviceInvite.code) заведения — см. tenant_slug'
        required: false
      chain_slug:
        description: 'Код сети (chains.slug), если заведение — точка сети: приложение гостя тогда общее на сеть, с выбором заведения'
        required: false

# Личная сборка заведения. Запускает только saas-gateway (createBuildJob)
# через workflow_dispatch — токен с правом Actions: write лежит на сервере.
#
# Один запуск — кассы Android и Windows и приложение гостя. Код общий для
# всех заведений (SAAS_MODE=true), но в сборку зашиты код заведения и код
# приглашения (SAAS_PRESET_SLUG/SAAS_PRESET_INVITE_CODE) — приложение само
# присоединяется при первом запуске. Брендинг заведения (название,
# логотип) — только у приложения гостя, касса у всех «ZalPOS». У кассы и
# приложения гостя свои Firebase-приложения (com.hookahpossaas,
# com.kolibriloungesaas) и свои google-services.json.
#
# Файл намеренно не объединён с build-apk.yml (боевая сборка одного
# заведения): правка одного не должна задевать другой. Исправляя баг вроде
# ML Kit, R8 или App Links в одном, проверьте и остальные.
jobs:
  build:
    # push-триггер выше — только чтобы GitHub зарегистрировал workflow (см.
    # комментарий там же). Реальная сборка требует tenant_id/job_id_*,
    # которых push-событие не передаёт — поэтому push-запуски пропускаются.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pos
            entrypoint: lib/main.dart
            project_name: hookahpossaas          # applicationId = com.hookahpossaas
            application_id: com.hookahpossaas
            gservices_secret: GOOGLE_SERVICES_JSON_SAAS
            appid_secret: SAAS_FIREBASE_APP_ID
            default_icon: assets/icon/icon.png
            default_adaptive_icon: assets/icon/icon_foreground.png
            default_adaptive_bg: assets/icon/icon_background.png
            default_label: 'ZalPOS'
            artifact_prefix: zalpos-kassa
          - app: kolibri
            entrypoint: lib/client/kolibri_main.dart
            project_name: kolibriloungesaas       # applicationId = com.kolibriloungesaas
            application_id: com.kolibriloungesaas
            gservices_secret: GOOGLE_SERVICES_JSON_SAAS_KOLIBRI
            appid_secret: SAAS_FIREBASE_APP_ID_KOLIBRI
            # Без логотипа в «Брендинге» у приложения гостя знак платформы «◆»,
            # свой логотип заменяет его (шаг "Generate app launcher icon").
            default_icon: assets/icon/guest_icon.png
            default_adaptive_icon: assets/icon/guest_icon_foreground.png
            default_adaptive_bg: assets/icon/icon_background.png
            default_label: 'ZalPOS'
            artifact_prefix: zalpos-guest
    name: Build ${{ matrix.app }}

    steps:
      # Первым делом — формат всех входных параметров. Их присылает
      # saas-gateway (он сам генерирует id и проверяет права), но запустить
      # workflow_dispatch можно и мимо него; ниже часть значений попадает в
      # shell-команды и пути — поэтому всё, что не похоже на id/код/слаг,
      # останавливает сборку до того, как она получит доступ к секретам.
      - name: Validate inputs
        shell: bash
        env:
          IN_TENANT_ID: ${{ inputs.tenant_id }}
          IN_JOB_POS: ${{ inputs.job_id_pos }}
          IN_JOB_KOLIBRI: ${{ inputs.job_id_kolibri }}
          IN_JOB_WIN: ${{ inputs.job_id_pos_windows }}
          IN_SLUG: ${{ inputs.tenant_slug }}
          IN_INVITE: ${{ inputs.invite_code }}
          IN_CHAIN: ${{ inputs.chain_slug }}
        run: |
          fail() { echo "::error::Некорректный параметр сборки: $1"; exit 1; }
          id_ok() { [[ -z "$1" || "$1" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; }
          id_ok "$IN_TENANT_ID" || fail tenant_id
          id_ok "$IN_JOB_POS" || fail job_id_pos
          id_ok "$IN_JOB_KOLIBRI" || fail job_id_kolibri
          id_ok "$IN_JOB_WIN" || fail job_id_pos_windows
          [[ -z "$IN_SLUG" || "$IN_SLUG" =~ ^[a-z0-9-]{1,63}$ ]] || fail tenant_slug
          [[ -z "$IN_INVITE" || "$IN_INVITE" =~ ^[A-Za-z0-9]{4,32}$ ]] || fail invite_code
          [[ -z "$IN_CHAIN" || "$IN_CHAIN" =~ ^[a-z0-9-]{1,63}$ ]] || fail chain_slug

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-saas-${{ matrix.app }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate missing Android platform files
        run: |
          # --project-name разный для каждого приложения матрицы: одинаковый
          # applicationId у двух приложений в одном Firebase-проекте
          # невозможен (см. шапку файла) — ни в консоли, ни физически на
          # одном устройстве (второй APK затёр бы первый при установке).
          flutter create . --platforms=android --org com --project-name ${{ matrix.project_name }}
          test -d android && echo "android/ готова" || (echo "не удалось создать android/" && exit 1)

          # flutter create кладёт в test/ свой шаблонный widget_test.dart,
          # который импортирует несуществующий здесь package:${{ matrix.project_name }}/main.dart —
          # валит шаг тестов. Файл в репозитории не хранится.
          rm -f test/widget_test.dart

      - name: Bump compileSdk for CameraX / mobile_scanner compatibility
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          sed -i -E 's/compileSdk[[:space:]]*=.*/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$APP_GRADLE"
          grep -E "compileSdk" "$APP_GRADLE"

      - name: Add google-services.json (SaaS Firebase project)
        env:
          GSERVICES: ${{ secrets[matrix.gservices_secret] }}
        run: |
          # matrix.application_id зарегистрирован в Firebase-проекте платформы
          # (не hoocah-pos), у каждого приложения матрицы свой
          # google-services.json в секретах.
          if [ -z "$GSERVICES" ]; then
            echo "::error::Секрет ${{ matrix.gservices_secret }} не задан (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$GSERVICES" > android/app/google-services.json
          grep -q "${{ matrix.application_id }}" android/app/google-services.json \
            || (echo "::error::В ${{ matrix.gservices_secret }} нет приложения ${{ matrix.application_id }}" && exit 1)

      - name: Apply Google Services Gradle plugin
        run: |
          SETTINGS=android/settings.gradle.kts
          [ -f "$SETTINGS" ] || SETTINGS=android/settings.gradle
          APP_GRADLE=android/app/build.gradle.kts
          [ -f "$APP_GRADLE" ] || APP_GRADLE=android/app/build.gradle
          PROJECT_GRADLE=android/build.gradle.kts
          [ -f "$PROJECT_GRADLE" ] || PROJECT_GRADLE=android/build.gradle

          if grep -q "pluginManagement" "$SETTINGS" 2>/dev/null; then
            if ! grep -q "com.google.gms.google-services" "$SETTINGS"; then
              sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$SETTINGS"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services")' "$APP_GRADLE"
            fi
          else
            if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
              sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
            fi
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
          fi

      - name: Ensure required permissions and manifest entries
        env:
          # Бренд заведения — только у приложения гостя, у кассы APP_LABEL пуст.
          #
          # Порядок операндов важен: `matrix.app == 'pos' && '' || X` не
          # тернарник — '' ложно, и выражение скатывается в X. Пустая строка
          # должна быть веткой по умолчанию (после ||).
          APP_LABEL: ${{ matrix.app == 'kolibri' && inputs.app_label || '' }}
          DEFAULT_LABEL: ${{ matrix.default_label }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          add_permission() {
            if ! grep -q "$1" "$MANIFEST"; then
              sed -i "/<manifest /a\\    <uses-permission android:name=\"$1\" />" "$MANIFEST"
            fi
          }
          add_permission "android.permission.INTERNET"
          add_permission "android.permission.CAMERA"
          add_permission "android.permission.READ_MEDIA_IMAGES"
          add_permission "android.permission.READ_EXTERNAL_STORAGE"
          add_permission "android.permission.RECORD_AUDIO"
          add_permission "android.permission.POST_NOTIFICATIONS"
          add_permission "android.permission.SCHEDULE_EXACT_ALARM"
          add_permission "android.permission.USE_EXACT_ALARM"
          add_permission "android.permission.RECEIVE_BOOT_COMPLETED"
          add_permission "android.permission.VIBRATE"
          add_permission "android.permission.FOREGROUND_SERVICE"
          add_permission "android.permission.FOREGROUND_SERVICE_DATA_SYNC"
          add_permission "android.permission.WAKE_LOCK"
          # Обновление изнутри приложения (AppUpdateService): скачанный APK
          # новой версии открывается системным установщиком — без этого
          # разрешения Android молча отказывается его ставить.
          add_permission "android.permission.REQUEST_INSTALL_PACKAGES"

          # Касса ходит к УТМ ЕГАИС по http:// в локальной сети заведения
          # (УТМ не умеет HTTPS) — Android 9+ без этого флага молча
          # блокирует такие запросы. Гостевому приложению это не нужно.
          if [ "${{ matrix.app }}" = "pos" ] && ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

          if ! grep -q "android.hardware.camera" "$MANIFEST"; then
            sed -i "/<manifest /a\\    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />" "$MANIFEST"
          fi

          if ! grep -q "<queries>" "$MANIFEST"; then
            sed -i "/<\/manifest>/i\\    <queries>\n        <intent>\n            <action android:name=\"android.media.action.IMAGE_CAPTURE\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.speech.RecognitionService\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <data android:scheme=\"tel\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.DIAL\" />\n            <data android:scheme=\"tel\" />\n        </intent>\n    </queries>" "$MANIFEST"
          fi

          if ! grep -q "com.google.mlkit.vision.DEPENDENCIES" "$MANIFEST"; then
            sed -i "/<application/,/>/{/>/a\\    <meta-data android:name=\"com.google.mlkit.vision.DEPENDENCIES\" android:value=\"barcode\" />
            }" "$MANIFEST"
          fi

          python3 - "$MANIFEST" <<'PYEOF'
          import os, re, sys
          path = sys.argv[1]
          xml = open(path, encoding='utf-8').read()
          if 'flutter_foreground_task' not in xml:
              service = (
                  '        <service\n'
                  '            android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n'
                  '            android:foregroundServiceType="dataSync"\n'
                  '            android:stopWithTask="false"\n'
                  '            android:exported="false" />\n'
              )
              xml = xml.replace('</application>', service + '    </application>', 1)
              open(path, 'w', encoding='utf-8').write(xml)
          if 'ScheduledNotificationReceiver' not in xml:
              receivers = (
                  '        <receiver android:exported="false" '
                  'android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" '
                  'android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
              )
              xml = xml.replace('</application>', receivers + '    </application>', 1)
              open(path, 'w', encoding='utf-8').write(xml)

          # Название под иконкой: у кассы всегда «ZalPOS», у гостя —
          # branding.appName. Чистим здесь же: workflow_dispatch можно
          # вызвать и мимо сервера, а значение идёт в XML манифеста.
          label = (os.environ.get('APP_LABEL') or '').strip()
          label = re.sub(r'[^\w .,()&-]', '', label, flags=re.UNICODE).strip()[:30]
          if not label:
              label = os.environ.get('DEFAULT_LABEL') or 'ZalPOS'
          label = (label.replace('&', '&amp;').replace('<', '&lt;')
                        .replace('>', '&gt;').replace('"', '&quot;').replace("'", '&apos;'))
          xml = open(path, encoding='utf-8').read()
          xml = re.sub(r'android:label="[^"]*"', 'android:label="' + label + '"', xml, count=1)
          open(path, 'w', encoding='utf-8').write(xml)
          PYEOF

          cat "$MANIFEST"

      - name: Enable core library desugaring
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          IS_KTS=1
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE=android/app/build.gradle
            IS_KTS=0
          fi
          python3 - "$APP_GRADLE" "$IS_KTS" <<'PYEOF'
          import re, sys
          path, is_kts = sys.argv[1], sys.argv[2] == '1'
          src = open(path, encoding='utf-8').read()

          if 'isCoreLibraryDesugaringEnabled' not in src and 'coreLibraryDesugaringEnabled' not in src:
              flag = ('        isCoreLibraryDesugaringEnabled = true\n' if is_kts
                      else '        coreLibraryDesugaringEnabled true\n')
              if 'compileOptions' in src:
                  src = re.sub(r'(compileOptions\s*\{)', r'\1\n' + flag.rstrip('\n'), src, count=1)
              else:
                  block = ('    compileOptions {\n' + flag +
                           ('        sourceCompatibility = JavaVersion.VERSION_11\n'
                            '        targetCompatibility = JavaVersion.VERSION_11\n' if is_kts else
                            '        sourceCompatibility JavaVersion.VERSION_11\n'
                            '        targetCompatibility JavaVersion.VERSION_11\n') +
                           '    }\n')
                  src = src.replace('    buildTypes {', block + '    buildTypes {', 1)

          if 'desugar_jdk_libs' not in src:
              dep = ('    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                     if is_kts else
                     "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
              if re.search(r'^dependencies\s*\{', src, re.M):
                  src = re.sub(r'^(dependencies\s*\{)', r'\1\n' + dep, src, count=1, flags=re.M)
              else:
                  src += '\ndependencies {\n' + dep + '\n}\n'

          open(path, 'w', encoding='utf-8').write(src)
          print('desugaring включён')
          PYEOF

      - name: Force bundled (offline) ML Kit barcode model
        run: |
          APP_GRADLE=android/app/build.gradle.kts
          IS_KTS=1
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE=android/app/build.gradle
            IS_KTS=0
          fi
          if ! grep -q "com.google.mlkit:barcode-scanning" "$APP_GRADLE"; then
            if [ "$IS_KTS" = "1" ]; then
              DEP_LINE='    implementation("com.google.mlkit:barcode-scanning:17.3.0")'
            else
              DEP_LINE="    implementation 'com.google.mlkit:barcode-scanning:17.3.0'"
            fi
            if grep -q "^dependencies {" "$APP_GRADLE"; then
              sed -i "/^dependencies {/a\\${DEP_LINE}" "$APP_GRADLE"
            else
              printf '\ndependencies {\n%s\n}\n' "$DEP_LINE" >> "$APP_GRADLE"
            fi
          fi

      - name: Add ProGuard/R8 keep rules for ML Kit and mobile_scanner
        run: |
          RULES=android/app/proguard-rules.pro
          mkdir -p "$(dirname "$RULES")"
          touch "$RULES"
          if ! grep -q "google.mlkit" "$RULES" 2>/dev/null; then
            cat >> "$RULES" <<'EOF'
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode_bundled.** { *; }
          -keep class com.google.mlkit.vision.barcode.** { *; }
          -keep class com.google.mlkit.vision.common.** { *; }
          -keep class com.google.mlkit.common.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          -keep class androidx.camera.** { *; }
          -dontwarn androidx.camera.**
          EOF
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Тот же постоянный ключ, что у build-apk.yml: издатель один, лишний
          # keystore ничего не даёт. Постоянная подпись нужна для обновления
          # поверх.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK подписан debug-ключом."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          APP_GRADLE=android/app/build.gradle.kts
          if [ -f "$APP_GRADLE" ]; then
            python3 - "$APP_GRADLE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          if 'keystoreProperties' not in src:
              header = (
                  'import java.util.Properties\n'
                  'import java.io.FileInputStream\n\n'
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              src = header + src
              signing = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String?\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String?\n'
                  '            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n'
                  '            storePassword = keystoreProperties["storePassword"] as String?\n'
                  '        }\n'
                  '    }\n'
              )
              src = src.replace('    buildTypes {', signing + '    buildTypes {', 1)
              src = src.replace('signingConfig = signingConfigs.getByName("debug")',
                                'signingConfig = signingConfigs.getByName("release")')
              open(path, 'w', encoding='utf-8').write(src)
          PYEOF
          else
            echo "::warning::build.gradle.kts не найден — проверьте подпись вручную"
          fi

      - name: Create notification icon
        run: |
          DRAWABLE=android/app/src/main/res/drawable
          mkdir -p "$DRAWABLE"
          cat > "$DRAWABLE/ic_notification.xml" <<'XMLEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M10.6,3.2h2.8v11.2h-2.8z"/>
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M12,18.6m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0"/>
          </vector>
          XMLEOF
          if [ "${{ matrix.app }}" = "pos" ]; then
            # Касса — силуэт смарт-терминала с чеком, как на её иконке. Android
            # рисует значок уведомления одним белым цветом, поэтому только контур.
            cat > "$DRAWABLE/ic_notification.xml" <<'XMLEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:fillType="evenOdd"
                android:pathData="M8,2.9L9,2.2L10,2.9L11,2.2L12,2.9L13,2.2L14,2.9L15,2.2L16,2.9V8.3H8Z M9.6,4.6H14.4V5.6H9.6Z M9.6,6.4H13V7.4H9.6Z"/>
            <path
                android:fillColor="#FFFFFFFF"
                android:fillType="evenOdd"
                android:pathData="M6.6,8.9H17.4A2.6,2.6 0 0 1 20,11.5V18.9A2.6,2.6 0 0 1 17.4,21.5H6.6A2.6,2.6 0 0 1 4,18.9V11.5A2.6,2.6 0 0 1 6.6,8.9Z M7,11H17V16.2H7Z M10,18.2H14V19.4H10Z"/>
          </vector>
          XMLEOF
          fi

          # Значок уведомления фоновой службы кассы: flutter_foreground_task
          # берёт его по имени meta-data (lib/services/hall_watch_service.dart).
          # Без него служба показывала цветную иконку приложения — Android
          # рисовал её в шторке мутным пятном.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "com.zalpos.notification_icon" "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name="com.zalpos.notification_icon" android:resource="@drawable/ic_notification" />\n    </application>|' "$MANIFEST"
          fi
          KEEP=android/app/src/main/res/raw
          mkdir -p "$KEEP"
          cat > "$KEEP/keep.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/ic_notification" />
          XMLEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        env:
          # Иконка из логотипа — только у приложения гостя; у кассы LOGO_URL
          # пуст (та же ловушка `cond && '' || X`, что у APP_LABEL).
          LOGO_URL: ${{ matrix.app == 'kolibri' && inputs.logo_url || '' }}
          DEFAULT_ICON: ${{ matrix.default_icon }}
          DEFAULT_ADAPTIVE_ICON: ${{ matrix.default_adaptive_icon }}
          DEFAULT_ADAPTIVE_BG: ${{ matrix.default_adaptive_bg }}
        run: |
          use_default_icon() {
            sed -i -E "s|image_path: \".*\"|image_path: \"$DEFAULT_ICON\"|" pubspec.yaml
            sed -i -E "s|adaptive_icon_foreground: \".*\"|adaptive_icon_foreground: \"$DEFAULT_ADAPTIVE_ICON\"|" pubspec.yaml
            sed -i -E "s|adaptive_icon_background: \".*\"|adaptive_icon_background: \"$DEFAULT_ADAPTIVE_BG\"|" pubspec.yaml
            dart run flutter_launcher_icons
          }
          # Иконка приложения гостя из branding.logoUrl. Нет логотипа, битый
          # файл, нет сети — берём знак ZalPOS «◆», сборка не падает.
          if [ -n "$LOGO_URL" ] && curl -fsSL --max-time 20 "$LOGO_URL" -o /tmp/tenant_logo.png && [ -s /tmp/tenant_logo.png ]; then
            sed -i -E 's|image_path: ".*"|image_path: "/tmp/tenant_logo.png"|' pubspec.yaml
            sed -i -E 's|adaptive_icon_foreground: ".*"|adaptive_icon_foreground: "/tmp/tenant_logo.png"|' pubspec.yaml
            sed -i -E 's|adaptive_icon_background: ".*"|adaptive_icon_background: "#000000"|' pubspec.yaml
            if ! dart run flutter_launcher_icons; then
              echo "::warning::Не удалось собрать иконку из логотипа заведения — используется общая иконка"
              use_default_icon
            fi
          else
            use_default_icon
          fi

      - name: Unit tests
        run: flutter test

      - name: Build APK (release, SaaS mode)
        env:
          SAAS_FIREBASE_API_KEY: ${{ secrets.SAAS_FIREBASE_API_KEY }}
          SAAS_FIREBASE_APP_ID: ${{ secrets[matrix.appid_secret] }}
          SAAS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.SAAS_FIREBASE_MESSAGING_SENDER_ID }}
          SAAS_FIREBASE_PROJECT_ID: ${{ secrets.SAAS_FIREBASE_PROJECT_ID }}
          SAAS_FIREBASE_STORAGE_BUCKET: ${{ secrets.SAAS_FIREBASE_STORAGE_BUCKET }}
          PII_GATEWAY_URL: https://pii.zalpos.ru/
          SAAS_GATEWAY_URL: https://pii.zalpos.ru/saas
          # env:, не прямая интерполяция ${{ }} в run: — inputs.* приходят от
          # вызывающего (обычно saas-gateway, но workflow_dispatch technically
          # можно дёрнуть и напрямую), доверять им как части shell-команды
          # нельзя, только как значению переменной окружения.
          TENANT_SLUG: ${{ inputs.tenant_slug }}
          # Код приглашения нужен только кассе: гостевой APK раздаётся публично,
          # и код в нём открыл бы любому доступ кассы к данным заведения.
          INVITE_CODE: ${{ matrix.app == 'pos' && inputs.invite_code || '' }}
          # Приложение гостя точки сети — общее на сеть: при запуске гость
          # выбирает заведение (kSaasPresetChainSlug).
          CHAIN_SLUG: ${{ matrix.app == 'kolibri' && inputs.chain_slug || '' }}
        run: |
          if [ -z "$SAAS_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Секреты SAAS_FIREBASE_* не заданы — см. saas/README.md, раздел «APK-конвейер»."
            exit 1
          fi
          if [ -z "$SAAS_FIREBASE_APP_ID" ]; then
            echo "::error::Секрет ${{ matrix.appid_secret }} не задан — см. saas/README.md, раздел «APK-конвейер»."
            exit 1
          fi
          # INVITE_CODE у приложения гостя пуст: код приглашения ему не нужен.
          # --build-number — versionCode: номер запуска растёт, и новая версия
          # ставится поверх (при той же подписи). IN_APP_UPDATES включает
          # плашку «Вышла новая версия» (lib/services/app_update_service.dart).
          flutter build apk --release \
            -t ${{ matrix.entrypoint }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SAAS_MODE=true \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=IN_APP_UPDATES=true \
            --dart-define=SAAS_FIREBASE_API_KEY="$SAAS_FIREBASE_API_KEY" \
            --dart-define=SAAS_FIREBASE_APP_ID="$SAAS_FIREBASE_APP_ID" \
            --dart-define=SAAS_FIREBASE_MESSAGING_SENDER_ID="$SAAS_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=SAAS_FIREBASE_PROJECT_ID="$SAAS_FIREBASE_PROJECT_ID" \
            --dart-define=SAAS_FIREBASE_STORAGE_BUCKET="$SAAS_FIREBASE_STORAGE_BUCKET" \
            --dart-define=PII_GATEWAY_URL="$PII_GATEWAY_URL" \
            --dart-define=SAAS_GATEWAY_URL="$SAAS_GATEWAY_URL" \
            --dart-define=SAAS_PRESET_SLUG="$TENANT_SLUG" \
            --dart-define=SAAS_PRESET_INVITE_CODE="$INVITE_CODE" \
            --dart-define=SAAS_PRESET_CHAIN_SLUG="$CHAIN_SLUG"

      - name: Resolve job id for this matrix leg
        id: jobid
        # always(): jobId нужен шагу "Report failure to buildJobs" и при
        # падении сборки, иначе запись в кабинете навсегда останется
        # «в очереди».
        if: always()
        env:
          APP: ${{ matrix.app }}
          JOB_POS: ${{ inputs.job_id_pos }}
          JOB_KOLIBRI: ${{ inputs.job_id_kolibri }}
        run: |
          if [ "$APP" = "pos" ]; then
            echo "value=$JOB_POS" >> "$GITHUB_OUTPUT"
          else
            echo "value=$JOB_KOLIBRI" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        id: rename
        run: |
          # Имя файла — {job_id}.apk, свой на каждое приложение матрицы
          # (см. предыдущий шаг) — handleDownloadBuild в saas-gateway/server.js
          # ищет файл именно по jobId соответствующего buildJobs-документа.
          OUT="build/app/outputs/flutter-apk/${{ steps.jobid.outputs.value }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact (GitHub Actions run log)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ steps.jobid.outputs.value }}
          path: ${{ steps.rename.outputs.path }}

      # Артефакт Actions виден только тем, у кого доступ к репозиторию, поэтому
      # сборку кладём на сервер платформы, а владелец скачивает её через
      # saas-gateway с проверкой прав (handleDownloadBuild).
      #
      # Ключ DEPLOY_SSH_KEY_TENANT отдельный от ключа публичного APK, у каждого
      # свой forced-command на сервере. tenant_id и job_id передаём через env, а
      # не ${{ }} в run: — inputs нельзя подставлять в shell; сервер тоже
      # проверяет их формат.
      - name: Deploy APK to own server (pii.zalpos.ru)
        if: success()
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_TENANT }}
          SSH_HOST: pii.zalpos.ru
          TENANT_ID: ${{ inputs.tenant_id }}
          JOB_ID: ${{ steps.jobid.outputs.value }}
          APK_PATH: ${{ steps.rename.outputs.path }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::DEPLOY_SSH_KEY_TENANT не задан — без него личные сборки некуда доставлять. См. saas/README.md, раздел «Сборки приложений»."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_tenant_key
          chmod 600 ~/.ssh/deploy_tenant_key
          ssh -i ~/.ssh/deploy_tenant_key -o StrictHostKeyChecking=no root@"$SSH_HOST" \
            "$TENANT_ID $JOB_ID" \
            < "$APK_PATH"

      # Сообщаем серверу, что сборка готова. downloadPath — только для
      # истории: раздачу сервер строит по tenantId и jobId.
      - name: Report success to buildJobs
        if: success()
        run: |
          curl -sS -X POST "https://pii.zalpos.ru/saas/completeBuildJob" \
            -H "Content-Type: application/json" \
            -H "x-callback-secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -d "{\"jobId\":\"${{ steps.jobid.outputs.value }}\",\"status\":\"success\",\"buildNumber\":${{ github.run_number }},\"downloadPath\":\"tenant-builds/${{ inputs.tenant_id }}/${{ steps.jobid.outputs.value }}.apk\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Report failure to buildJobs
        if: failure()
        run: |
          curl -sS -X POST "https://pii.zalpos.ru/saas/completeBuildJob" \
            -H "Content-Type: application/json" \
            -H "x-callback-secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -d "{\"jobId\":\"${{ steps.jobid.outputs.value }}\",\"status\":\"failed\",\"errorMessage\":\"Сборка упала — подробности в логе запуска (${{ matrix.app }}).\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # Касса для Windows: тот же lib/main.dart и те же коды заведения, но свой
  # job — нужен windows-latest с Build Tools и другие шаги (CMake, установщик
  # вместо APK). Приложение гостя для Windows не собираем.
  #
  # Firebase на Windows получает конфиг запросом к /firebaseConfig (см.
  # resolveWindowsOptions в lib/firebase_options.dart), поэтому
  # google-services.json и секреты *_APP_ID здесь не нужны.
  build-windows:
    runs-on: windows-latest
    name: Build pos (Windows)

    steps:
      # Первым делом — формат всех входных параметров. Их присылает
      # saas-gateway (он сам генерирует id и проверяет права), но запустить
      # workflow_dispatch можно и мимо него; ниже часть значений попадает в
      # shell-команды и пути — поэтому всё, что не похоже на id/код/слаг,
      # останавливает сборку до того, как она получит доступ к секретам.
      - name: Validate inputs
        shell: bash
        env:
          IN_TENANT_ID: ${{ inputs.tenant_id }}
          IN_JOB_POS: ${{ inputs.job_id_pos }}
          IN_JOB_KOLIBRI: ${{ inputs.job_id_kolibri }}
          IN_JOB_WIN: ${{ inputs.job_id_pos_windows }}
          IN_SLUG: ${{ inputs.tenant_slug }}
          IN_INVITE: ${{ inputs.invite_code }}
          IN_CHAIN: ${{ inputs.chain_slug }}
        run: |
          fail() { echo "::error::Некорректный параметр сборки: $1"; exit 1; }
          id_ok() { [[ -z "$1" || "$1" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; }
          id_ok "$IN_TENANT_ID" || fail tenant_id
          id_ok "$IN_JOB_POS" || fail job_id_pos
          id_ok "$IN_JOB_KOLIBRI" || fail job_id_kolibri
          id_ok "$IN_JOB_WIN" || fail job_id_pos_windows
          [[ -z "$IN_SLUG" || "$IN_SLUG" =~ ^[a-z0-9-]{1,63}$ ]] || fail tenant_slug
          [[ -z "$IN_INVITE" || "$IN_INVITE" =~ ^[A-Za-z0-9]{4,32}$ ]] || fail invite_code
          [[ -z "$IN_CHAIN" || "$IN_CHAIN" =~ ^[a-z0-9-]{1,63}$ ]] || fail chain_slug

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop support
        shell: bash
        run: flutter config --enable-windows-desktop

      - name: Generate missing Windows platform files
        shell: bash
        run: |
          flutter create . --platforms=windows
          test -d windows && echo "windows/ готова" || (echo "не удалось создать windows/" && exit 1)

          # Заголовок окна и название в свойствах файла — бренд платформы, а
          # не имя пакета. Имя exe (hookah_pos.exe) не меняем: обновление
          # ставится поверх старой папки, и ярлыки указывают на него.
          sed -i 's/L"hookah_pos"/L"ZalPOS"/' windows/runner/main.cpp
          sed -i -E 's/(VALUE "(FileDescription|ProductName)", )"hookah_pos"/\1"ZalPOS"/' windows/runner/Runner.rc
          grep -n 'ZalPOS' windows/runner/main.cpp windows/runner/Runner.rc || echo "::warning::заголовок окна не заменён"
          # Иконка кассы вместо стандартной иконки Flutter (exe, панель задач, ярлыки).
          cp assets/icon/app_icon.ico windows/runner/resources/app_icon.ico

          # Тот же трюк, что и у Android-сборки выше (см. её же комментарий):
          # flutter create кладёт в test/ свой шаблонный widget_test.dart
          # поверх уже существующих настоящих тестов проекта — валит шаг
          # тестов. Файл в репозитории не хранится.
          rm -f test/widget_test.dart

      - name: Install dependencies
        shell: bash
        run: flutter pub get

      - name: Unit tests
        shell: bash
        run: flutter test

      - name: Build Windows (release, SaaS mode)
        shell: bash
        env:
          PII_GATEWAY_URL: https://pii.zalpos.ru/
          SAAS_GATEWAY_URL: https://pii.zalpos.ru/saas
          # env:, не прямая интерполяция ${{ }} в run: — та же причина, что
          # и у Android-сборки выше: inputs.* нельзя доверять как части
          # shell-команды (workflow_dispatch technically можно дёрнуть и не
          # только через createBuildJob).
          TENANT_SLUG: ${{ inputs.tenant_slug }}
          INVITE_CODE: ${{ inputs.invite_code }}
          # CMakeLists Firebase C++ SDK требует cmake_minimum_required < 3.5, а
          # CMake 4.x на windows-latest считает это ошибкой.
          # CMAKE_POLICY_VERSION_MINIMUM — обходной путь из текста самой
          # ошибки; через env, потому что cmake вызывает flutter build.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # permission_handler_windows использует устаревший
          # <experimental/coroutine>, свежий MSVC на это падает (STL1011).
          # Глушим через CXXFLAGS — начальное значение CMAKE_CXX_FLAGS. Через
          # переменную CL нельзя: она ломает определение компилятора в CMake.
          CXXFLAGS: -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          if [ -z "$SAAS_GATEWAY_URL" ]; then
            echo "::error::Секрет SAAS_GATEWAY_URL не задан — без него Windows-сборка не сможет получить конфигурацию Firebase в рантайме (см. resolveWindowsOptions в lib/firebase_options.dart)."
            exit 1
          fi
          flutter build windows --release \
            -t lib/main.dart \
            --build-number=${{ github.run_number }} \
            --dart-define=SAAS_MODE=true \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=IN_APP_UPDATES=true \
            --dart-define=PII_GATEWAY_URL="$PII_GATEWAY_URL" \
            --dart-define=SAAS_GATEWAY_URL="$SAAS_GATEWAY_URL" \
            --dart-define=SAAS_PRESET_SLUG="$TENANT_SLUG" \
            --dart-define=SAAS_PRESET_INVITE_CODE="$INVITE_CODE"

      - name: Locate Release output folder
        id: outdir
        shell: bash
        run: |
          # Путь к runner/Release менялся между версиями Flutter (с x64/arm64 и
          # без), поэтому ищем. Нужна именно папка с .exe кассы,
          # flutter_windows.dll и data/, а не служебная ALL_BUILD.dir/Release
          # и не первый попавшийся .exe плагина.
          DIR=""
          while IFS= read -r d; do
            if [ -f "$d/flutter_windows.dll" ] && [ -d "$d/data" ] && ls "$d"/*.exe >/dev/null 2>&1; then
              DIR="$d"; break
            fi
          done < <(find build/windows -type d -path '*/runner/Release')
          if [ -z "$DIR" ]; then
            echo "::error::Не нашли готовую папку runner/Release (exe + flutter_windows.dll + data) после flutter build windows"
            find build/windows -maxdepth 4 -type d | head -50
            exit 1
          fi
          echo "Папка сборки: $DIR"
          ls -la "$DIR"
          echo "path=$DIR" >> "$GITHUB_OUTPUT"

      # Установщик setup.exe вместо zip-архива: касса ставится как обычная
      # программа — ярлыки на рабочем столе и в «Пуске», удаление через
      # «Приложения» Windows, повторная установка обновляет поверх (AppId
      # постоянный). Ставится в профиль пользователя без прав
      # администратора. Рядом с exe кладём библиотеки Visual C++ — без них
      # на «чистом» моноблоке касса не запускается.
      - name: Build Windows installer (setup.exe)
        id: zip
        shell: pwsh
        run: |
          $out = (Resolve-Path "${{ steps.outdir.outputs.path }}").Path
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $out -Force }
          }
          $exe = (Get-ChildItem $out -Filter *.exe | Select-Object -First 1).Name
          if (-not $exe) { Write-Error "В папке сборки нет exe"; exit 1 }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup не установлен"; exit 1 }

          $dist = (New-Item -ItemType Directory -Force -Path "build/windows/installer").FullName
          $setupIcon = (Resolve-Path "assets/icon/app_icon.ico").Path
          $name = "${{ inputs.job_id_pos_windows }}"
          $iss = @"
          [Setup]
          AppId={{6F1C2A9E-3B7D-4E5A-9C41-5A7D3E2B9C10}
          AppName=ZalPOS
          AppVersion=1.0.${{ github.run_number }}
          AppPublisher=ZalPOS
          DefaultDirName={autopf}\ZalPOS
          DefaultGroupName=ZalPOS
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=$dist
          OutputBaseFilename=$name
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\$exe
          SetupIconFile=$setupIcon
          CloseApplications=yes

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Ярлык на рабочем столе"; GroupDescription: "Дополнительно:"

          [Files]
          Source: "$out\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          ; Платформа раньше называлась «Hookah POS» — при обновлении убираем
          ; старые ярлыки, чтобы не было двух одинаковых значков.
          [InstallDelete]
          Type: files; Name: "{group}\Hookah POS.lnk"
          Type: files; Name: "{autodesktop}\Hookah POS.lnk"

          [Icons]
          Name: "{group}\ZalPOS"; Filename: "{app}\$exe"
          Name: "{autodesktop}\ZalPOS"; Filename: "{app}\$exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\$exe"; Description: "Запустить ZalPOS"; Flags: nowait postinstall skipifsilent
          ; Тихая установка — это обновление изнутри кассы: запускаем её снова.
          Filename: "{app}\$exe"; Flags: nowait; Check: WizardSilent
          "@
          $issPath = Join-Path $dist "hookah_pos.iss"
          # Inno Setup читает .iss с BOM как UTF-8 — иначе русские подписи
          # в установщике превратятся в «кракозябры».
          [System.IO.File]::WriteAllText($issPath, $iss, (New-Object System.Text.UTF8Encoding $true))
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC завершился с ошибкой $LASTEXITCODE"; exit 1 }

          $setup = Join-Path $dist "$name.exe"
          if (-not (Test-Path $setup) -or (Get-Item $setup).Length -lt 1MB) {
            Write-Error "Установщик не создан или подозрительно мал: $setup"
            exit 1
          }
          Write-Host ("Установщик: {0} ({1:N1} МБ)" -f $setup, ((Get-Item $setup).Length / 1MB))
          echo "path=$setup" >> $env:GITHUB_OUTPUT

      - name: Upload Windows build artifact (GitHub Actions run log)
        uses: actions/upload-artifact@v4
        with:
          name: zalpos-kassa-windows-${{ inputs.job_id_pos_windows }}
          path: ${{ steps.zip.outputs.path }}

      # Тот же сервер и скрипт deploy-tenant-apk.sh: файл на диске всегда
      # «{jobId}.apk», а тип для браузера задаёт ответ handleDownloadBuild.
      - name: Deploy Windows build to own server (pii.zalpos.ru)
        if: success()
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_TENANT }}
          SSH_HOST: pii.zalpos.ru
          TENANT_ID: ${{ inputs.tenant_id }}
          JOB_ID: ${{ inputs.job_id_pos_windows }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::DEPLOY_SSH_KEY_TENANT не задан — без него личные сборки некуда доставлять. См. saas/README.md, раздел «Сборки приложений»."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_tenant_key
          chmod 600 ~/.ssh/deploy_tenant_key
          ssh -i ~/.ssh/deploy_tenant_key -o StrictHostKeyChecking=no root@"$SSH_HOST" \
            "$TENANT_ID $JOB_ID" \
            < "$ZIP_PATH"

      - name: Report success to buildJobs
        if: success()
        shell: bash
        run: |
          curl -sS -X POST "https://pii.zalpos.ru/saas/completeBuildJob" \
            -H "Content-Type: application/json" \
            -H "x-callback-secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -d "{\"jobId\":\"${{ inputs.job_id_pos_windows }}\",\"status\":\"success\",\"buildNumber\":${{ github.run_number }},\"downloadPath\":\"tenant-builds/${{ inputs.tenant_id }}/${{ inputs.job_id_pos_windows }}.apk\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Report failure to buildJobs
        if: failure()
        shell: bash
        run: |
          # Тело — из файла, а не аргументом -d: на Windows-раннере русский
          # текст в аргументах curl.exe портился кодировкой, и в кабинете
          # владелец видел «Windows-?????? ????? ?????».
          cat > report.json <<JSON
          {"jobId":"${{ inputs.job_id_pos_windows }}","status":"failed","errorMessage":"Windows-сборка кассы не удалась — подробности в логе запуска.","runUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          JSON
          curl -sS -X POST "https://pii.zalpos.ru/saas/completeBuildJob" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "x-callback-secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            --data-binary @report.json
