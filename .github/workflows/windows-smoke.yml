name: Windows-касса запускается (свой сервер)

# Проверка собирает кассу так же, как сборка заведения (release, SaaS,
# последний stable Flutter, код заведения в сборке) и запускает её против
# локального saas-gateway на этой же машине — как в бою: своя база (SQLite)
# и свой вход, без Firebase. К боевому серверу не обращается.
# Сценарии: первая установка → отдельное заведение; та же касса →
# переподключение к точке сети; повторный запуск уже подключённой кассы.
# Касса должна дойти до экрана входа и проработать минуту. Упала — в логе
# журнал шагов запуска (StartupLog), стек из отладчика и запись Windows.

on:
  workflow_dispatch:
  push:
    branches: [production, windows-build-ci-verify]
    paths:
      - '.github/workflows/windows-smoke.yml'
      - '.github/windows-smoke/**'
      - '.github/scripts/patch-firestore-windows.js'
      - '.github/scripts/prefetch-firebase-cpp-sdk.sh'
      - '.github/scripts/patch-windows-runner.js'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows smoke (Flutter stable)
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # firebase-admin (шлюзу он нужен только ради классов меток времени) без
      # ключа ищет сервер метаданных облака — на машине GitHub это долго.
      METADATA_SERVER_DETECTION: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install gateway deps
        shell: bash
        run: cd saas-gateway && npm ci --omit=dev

      - name: Generate Windows platform files
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows
          sed -i 's/L"hookah_pos"/L"ZalPOS"/' windows/runner/main.cpp
          # На весь экран без рамки по команде из приложения (канал zalpos/window).
          node .github/scripts/patch-windows-runner.js
          rm -f test/widget_test.dart
          # flutter create обновил pubspec.lock до свежих пакетов — вернуть
          # версии из репозитория, как в сборке заведений.
          git checkout -- pubspec.lock
          flutter pub get --enforce-lockfile
          # Как в сборке заведений: исправления плагинов cloud_firestore и
          # firebase_auth (их C++ всё ещё собирается вместе с кассой).
          node .github/scripts/patch-firestore-windows.js
          # И Firebase C++ SDK заранее, с повторами.
          bash .github/scripts/prefetch-firebase-cpp-sdk.sh

      - name: Build Windows (release, SaaS, код заведения win-smoke)
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # Как у сборки заведений + отладочные символы (PDB) для стека.
          # Ключи через «-», не «/»: Git Bash превращает «/DEBUG» в путь
          # C:/Program Files/Git/DEBUG, а MSVC понимает обе формы.
          CXXFLAGS: -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS -Zi -FS
          LDFLAGS: -DEBUG
        run: |
          flutter build windows --release \
            -t lib/main.dart \
            --dart-define=SAAS_MODE=true \
            --dart-define=PII_GATEWAY_URL=http://127.0.0.1:8096/ \
            --dart-define=SAAS_GATEWAY_URL=http://127.0.0.1:8095 \
            --dart-define=SAAS_PRESET_SLUG=win-smoke \
            --dart-define=SAAS_PRESET_INVITE_CODE=SMOKE1234

      # Шлюз и касса — в одном шаге: процессы, запущенные в отдельном шаге,
      # раннер Windows завершает вместе с ним.
      - name: Run scenarios (шлюз и касса)
        shell: pwsh
        timeout-minutes: 30
        run: |
          $dir = "${{ github.workspace }}\.github\windows-smoke"
          $gw = "${{ github.workspace }}\saas-gateway"
          $t = $env:RUNNER_TEMP
          $env:PORT = '8095'
          $env:DATA_BACKEND = 'local'
          $env:AUTH_BACKEND = 'own'
          $env:DATA_DB_FILE = "$t\smoke-data.sqlite"
          $env:AUTH_DB_FILE = "$t\smoke-auth.json"
          $env:SUPPORT_DB_FILE = "$t\smoke-support.sqlite"
          $env:SUPER_ADMINS_CACHE = "$t\smoke-super.json"
          $env:PII_GATEWAY_URL = 'http://127.0.0.1:8096/'
          $env:TELEGRAM_SECRET_KEY = [guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')

          # Справочник персональных данных — заглушка «ок» на этой же машине.
          Start-Process -FilePath 'node' -ArgumentList "`"$dir\pii-stub.js`"" -WindowStyle Hidden

          # Шлюз держит данные в памяти: seed.js правит базу, пока он остановлен.
          function Start-Gateway {
            $p = Start-Process -FilePath 'node' -ArgumentList "`"$gw\server.js`"" -WorkingDirectory $gw -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput "$t\gateway-$([guid]::NewGuid().ToString('N').Substring(0,6)).log" `
              -RedirectStandardError "$t\gateway-err-$([guid]::NewGuid().ToString('N').Substring(0,6)).log"
            for ($i = 0; $i -lt 60; $i++) {
              try { Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8095/health' -TimeoutSec 2 | Out-Null; Write-Host 'шлюз отвечает'; return $p } catch { Start-Sleep 2 }
            }
            Write-Host '::error::saas-gateway не запустился'
            Get-ChildItem "$t\gateway-*.log" | ForEach-Object { Write-Host "---- $($_.Name)"; Get-Content $_ -Tail 60 }
            exit 1
          }
          function Stop-Gateway($p) {
            # Запись на диск — каждые доли секунды; касса к этому моменту
            # уже минуту как ничего не пишет.
            Start-Sleep 2
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
          function Seed($mode) {
            node "$dir\seed.js" $mode
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::seed.js $mode не прошёл"; exit 1 }
          }

          $exe = Get-ChildItem -Recurse -Path build\windows -Filter hookah_pos.exe | Where-Object { $_.FullName -match '\\runner\\Release\\' } | Select-Object -First 1
          if (-not $exe) { Write-Host '::error::hookah_pos.exe не найден'; exit 1 }
          $syms = (Get-ChildItem -Recurse -Path build\windows -Filter *.pdb | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique) -join ';'

          Write-Host 'данные: демо-сеть через шлюз'
          $p = Start-Gateway
          Seed 'demo'
          Stop-Gateway $p

          Seed 'single'
          $p = Start-Gateway
          & "$dir\run.ps1" -Exe $exe.FullName -Name 'single-first-run' -SymbolDirs $syms
          & "$dir\run.ps1" -Exe $exe.FullName -Name 'single-restart' -SymbolDirs $syms
          Stop-Gateway $p

          Seed 'chain'
          $p = Start-Gateway
          & "$dir\run.ps1" -Exe $exe.FullName -Name 'chain-rejoin' -SymbolDirs $syms
          & "$dir\run.ps1" -Exe $exe.FullName -Name 'chain-restart' -SymbolDirs $syms
          Stop-Gateway $p

      - name: Server logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'gateway-*.log') -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "---- $($_.Name)"; Get-Content $_ -Tail 60 }

      - name: Result
        if: always()
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'smoke-results.txt'
          if (-not (Test-Path $f)) { Write-Host '::error::сценарии не запускались'; exit 1 }
          Get-Content $f
          if (Select-String -Path $f -Pattern '=fail' -Quiet) { Write-Host '::error::Windows-касса не дошла до экрана входа или упала'; exit 1 }
