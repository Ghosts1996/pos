name: Приложение курьера (APK)

# Приложение курьера для Android (android-courier/): окно с веб-приложением
# курьера и фоновая геолокация на смене. Собирается при каждом изменении
# android-courier/ в рабочей ветке и вручную (Run workflow). Файл уходит на
# свой сервер (https://pii.zalpos.ru/saas/courierApk — ссылка в профиле
# курьера), копия — в GitHub Release courier-apk. Отдельно от сборок кассы и
# гостя: правка одной сборки не задевает другие.
on:
  workflow_dispatch: {}
  push:
    branches: [production]
    paths:
      - 'android-courier/**'
      - '.github/workflows/courier-apk.yml'

concurrency:
  group: courier-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build courier APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Тот же ключ подписи, что у кассы (секреты GitHub). Нет секретов —
      # сборка подписывается отладочным ключом и всё равно ставится.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/courier.jks"
            echo "ZC_KEYSTORE=$RUNNER_TEMP/courier.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK подписан отладочным ключом"
          fi

      - name: Build APK (release)
        working-directory: android-courier
        env:
          ZC_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZC_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          cp android-courier/app/build/outputs/apk/release/app-release.apk zalpos-courier.apk
          ls -la zalpos-courier.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zalpos-courier-apk
          path: zalpos-courier.apk
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=courier-apk
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" zalpos-courier.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" zalpos-courier.apk \
              --repo "${{ github.repository }}" \
              --title "ZalPOS — приложение курьера" \
              --notes "Приложение курьера для Android: заказы, карта и маршрут, фоновая геолокация на смене. Файл обновляется на месте при каждой сборке."
          fi

      # Свой сервер: тот же скрипт доставки, что у демо гостя
      # (deploy-tenant-apk.sh, папка publicdemo, файл courier.apk), отдаёт
      # шлюз по GET /saas/courierApk через nginx.
      - name: Deploy to own server (pii.zalpos.ru)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_TENANT }}
          SSH_HOST: pii.zalpos.ru
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::DEPLOY_SSH_KEY_TENANT не задан — приложение курьера осталось только в GitHub Release."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_tenant_key
          chmod 600 ~/.ssh/deploy_tenant_key
          ssh -i ~/.ssh/deploy_tenant_key -o StrictHostKeyChecking=no root@"$SSH_HOST" "publicdemo courier" \
            < zalpos-courier.apk
