<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!--
  Один и тот же файл раздаётся ВСЕМ заведениям платформы (браузер узнаёт
  чьё именно — по поддомену, см. resolveTenant() в app.js) — поэтому имя
  здесь placeholder, а не бренд конкретного заведения. document.title
  переписывается на реальное (branding.appName) сразу после applyBranding()
  в app.js; apple-mobile-web-app-title ниже — статический HTML-атрибут,
  его на лету не заменить, поэтому там нейтральная подпись, а не чужой бренд.
-->
<title>Личный кабинет гостя</title>
<meta name="theme-color" content="#141414">
<meta name="description" content="Свой стол, счёт, заказ и бонусы — прямо с телефона">

<!-- Чтобы с «Домой» на iPhone открывалось как приложение, без адресной строки. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Личный кабинет гостя">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/onest-cyrillic-4c7562.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-cyrillic-4f4a82.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<!-- SDK Firebase — параллельно с app.js, а не после его разбора (быстрее
     первая отрисовка на мобильной сети). -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
<link rel="modulepreload" href="app.js">
<script src="palette.js"></script>
<script>
// Бренд из кэша (applyBranding в app.js) — до сети, чтобы при повторном
// заходе страница сразу была в цветах заведения. Свежие данные обновят кэш.
(function () {
  try {
    var slug = (location.hostname.split('.')[0] || '').trim();
    var raw = slug && localStorage.getItem('brand:' + slug);
    if (!raw) return;
    window.applyBrandPalette(JSON.parse(raw));
  } catch (_) {
    // Битый кэш — просто игнорируем, дальше подтянется свежий брендинг.
  }
})();
</script>
</head>
<body>

<div class="wrap" id="screen">
  <div class="spinner"></div>
</div>

<nav class="tabbar" id="tabbar" hidden>
  <!-- Контуры — те же, что в IC (app.js). -->
  <a href="#/" data-tab="home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v10.5h13V9"/><path d="M10 19.5v-5h4v5"/></svg><span>Главная</span></a>
  <a href="#/menu" data-tab="menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8"/><path d="M4.5 3v5a2.5 2.5 0 0 0 5 0V3"/><path d="M7 11v10"/><path d="M17 21V3c-2.2 1.3-3.5 3.8-3.5 7v3H17"/></svg><span>Меню</span></a>
  <a href="#/booking" data-tab="booking"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Бронь</span></a>
  <a href="#/table" data-tab="table"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 11V9M10.5 9h3"/></svg><span>Мой стол</span></a>
  <a href="#/profile" data-tab="profile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1-4 4-6 7.5-6s6.5 2 7.5 6"/></svg><span>Профиль</span></a>
</nav>

<div class="toast" id="toast"></div>

<script src="typograf.js" defer></script>
<script type="module" src="app.js"></script>
</body>
</html>
