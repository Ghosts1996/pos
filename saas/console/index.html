<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ZalPOS — касса и управление заведением: зал, склад, брони, лояльность</title>
<meta name="theme-color" content="#0A0909">
<meta name="description" content="Облачная касса для кафе, ресторанов, баров и лаунжей: карта зала, оплата и фискальные чеки, склад, брони, программа лояльности, смены и зарплата, гостевое приложение. Бесплатный тестовый период, запуск за 10–15 минут.">
<!-- Раньше здесь был noindex,nofollow — оставался с тех времён, когда эта
     страница была только личным кабинетом (см. screenDashboard) без
     публичного лендинга. Теперь тот же файл отдаёт и screenLanding() для
     незалогиненных посетителей (см. PUBLIC_ROUTES в console.js) — открывать
     его поисковикам можно и нужно, коммерческий сайт без индексации не
     находят. Авторизованные экраны от этого не страдают: анонимный краулер
     видит ровно то же, что и обычный посетитель без входа, — сам лендинг. -->
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://zalpos.ru/">
<meta property="og:type" content="website">
<meta property="og:title" content="ZalPOS — касса и управление заведением">
<meta property="og:description" content="Касса, склад, брони, лояльность и гостевое приложение для кафе, ресторанов, баров и лаунжей. Бесплатный тестовый период.">
<meta property="og:image" content="https://zalpos.ru/favicon.png">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="console.css">
<!-- SDK Firebase качаем параллельно с console.js, а не после его разбора:
     иначе на мобильной сети первая отрисовка ждала лишний последовательный
     шаг загрузки. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js">
<link rel="modulepreload" href="console.js">
</head>
<body>

<div class="wrap" id="screen">
  <div class="spinner"></div>
</div>

<div class="toast" id="toast"></div>

<script src="typograf.js" defer></script>
<script type="module" src="console.js"></script>
</body>
</html>
