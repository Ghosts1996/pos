<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ZalPOS — касса и управление заведением: зал, склад, брони, лояльность</title>
<meta name="theme-color" content="#F3EEE6">
<meta name="color-scheme" content="light dark">
<!-- Тема до первой отрисовки, без белой вспышки: выбор посетителя
     (кнопка в шапке, localStorage) или тема его устройства. -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('zalpos-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0D0C0A' : '#F3EEE6');
})();
</script>
<meta name="description" content="Облачная касса для кафе, ресторанов, баров и лаунжей. Карта зала, фискальные чеки, склад, брони, бонусы, смены и зарплата, приложение гостя с вашим логотипом. Пробный период бесплатно, без процента с продаж.">
<!-- Без входа здесь лендинг — его индексируем; кабинет краулер не увидит. -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="canonical" href="https://zalpos.ru/">
<!-- Превью ссылки в мессенджерах: фирменная карточка 1200×630. Новое имя
     файла — чтобы Telegram и другие не показывали закешированную старую
     картинку (меняя карточку, меняйте и имя). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZalPOS">
<meta property="og:url" content="https://zalpos.ru/">
<meta property="og:title" content="ZalPOS — касса, зал и гости в одном планшете">
<meta property="og:description" content="Касса на Android и Windows, карта зала, брони, склад, бонусы и приложение гостя для кафе, ресторанов, баров и лаунжей. Пробный период бесплатно и без карты.">
<meta property="og:image" content="https://zalpos.ru/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ZalPOS: зал, касса и гости в одном планшете">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://zalpos.ru/og-image.png">
<!-- Значок приложения кассы — и во вкладке, и в поиске Google/Яндекса
     (им нужен квадрат кратный 48 px и /favicon.ico в корне). -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<!-- Яндекс берёт для поиска и подсказок браузера значок 120×120. -->
<link rel="icon" type="image/png" sizes="120x120" href="/favicon-120.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Кто это и где логотип — для поисковиков (Яндекс, Google). -->
<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://zalpos.ru/#org","name":"ZalPOS","url":"https://zalpos.ru/","logo":{"@type":"ImageObject","url":"https://zalpos.ru/favicon.png","width":512,"height":512}},{"@type":"WebSite","@id":"https://zalpos.ru/#site","url":"https://zalpos.ru/","name":"ZalPOS","inLanguage":"ru-RU","publisher":{"@id":"https://zalpos.ru/#org"}},{"@type":"SoftwareApplication","name":"ZalPOS","applicationCategory":"BusinessApplication","operatingSystem":"Android, Windows","url":"https://zalpos.ru/","publisher":{"@id":"https://zalpos.ru/#org"}}]}</script>
<link rel="preload" href="fonts/onest-cyrillic-4c7562.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-cyrillic-4f4a82.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="console.css">
<!-- SDK Firebase качаем параллельно с console.js, а не после его разбора:
     иначе на мобильной сети первая отрисовка ждала лишний последовательный
     шаг загрузки. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
<link rel="modulepreload" href="console.js">
</head>
<body>

<div class="wrap" id="screen">
  <div class="spinner"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Переключатель темы для страниц без шапки (вход, документы, мастер
     создания заведения); в шапке сайта и кабинета — свой, а этот прячется. -->
<button type="button" class="theme-toggle theme-fab" aria-label="Сменить тему"></button>

<script src="typograf.js" defer></script>
<script type="module" src="console.js"></script>
</body>
</html>
